<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #180108 0%, #060003 60%, #010002 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Đốm sáng đom đóm nền */
    .bg-firefly {
      position: absolute;
      background: #ff2a55;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.35;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.15; }
      50% { transform: translateY(-25px) scale(1.3); opacity: 0.65; }
    }

    /* Khung Phong bì */
    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 0, 51, 0.4), 0 0 35px rgba(255, 42, 85, 0.2);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ff6b81 0%, #ff0033 70%, #80001a 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ff99aa;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 0, 51, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff6680;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    /* Lá thư trồi lên */
    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 0, 51, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff0033, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    /* Khung Canvas Trái tim 3D */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
      cursor: grab;
      user-select: none;
    }

    #heart-wrapper:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Thư -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Canvas Trái tim 3D Đỏ Nhỏ Gọn & Chữ Xoay Dưới -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "Bé iuu Bảo Bei Nhất 💕",
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    // Tạo đom đóm nền
    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 35; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 3.5 + 1.5;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    // Hiệu ứng rê chuột / chạm ngón tay
    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.2) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '❤️' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
      }, 1100);
    }

    function startHeartShow(e) {
      e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initCompact3DHeart();
      }, 850);
    }

    function initCompact3DHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Tương tác kéo xoay 3D
      let rotX = 0.12;
      let rotY = 0;
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;

      const hw = document.getElementById('heart-wrapper');
      hw.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        rotY += dx * 0.007;
        rotX += dy * 0.007;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });

      // Phương trình toán học trái tim chuẩn
      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      // Chỉ sử dụng duy nhất các sắc thái ĐỎ
      const redColors = [
        '#ff0033', // Đỏ tươi
        '#ff1744', // Đỏ thắm
        '#ff2a55', // Đỏ neon
        '#e60026', // Đỏ đậm
        '#d00028', // Đỏ ruby
        '#ff3b69', // Đỏ viền sáng
        '#b30021'  // Đỏ nhung sâu
      ];

      const particles = [];
      const TOTAL_PARTICLES = 6500; // Đảm bảo quả tim hiện rõ nét mà hạt vẫn nhỏ

      for (let i = 0; i < TOTAL_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const base = heartCurve(t);

        // 35% hạt bám viền ngoài làm rõ hình dáng trái tim, 65% trải đều thể tích
        const isRim = i < TOTAL_PARTICLES * 0.35;
        const layer = isRim 
          ? (0.92 + Math.random() * 0.08) 
          : (0.15 + Math.sqrt(Math.random()) * 0.82);

        const x2D = base.x * layer;
        const y2D = (base.y - (-2.5)) * layer + (-2.5);

        // Phân bổ độ dày 3D
        const depthCurve = Math.max(0.08, (base.y + 17) / 33);
        const maxZ = 8.5 * depthCurve * Math.sqrt(Math.max(0, 1 - Math.pow(layer - 0.5, 2)));
        const z3D = (Math.random() * 2 - 1) * maxZ * (isRim ? 0.6 : 1);

        const scatterAngle = Math.random() * Math.PI * 2;
        const scatterDist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

        particles.push({
          origX: x2D,
          origY: y2D,
          origZ: z3D,
          currX: width / 2 + Math.cos(scatterAngle) * scatterDist,
          currY: height / 2 + Math.sin(scatterAngle) * scatterDist,
          // Kích thước hạt nhỏ li ti như ban đầu (0.75px - 1.45px)
          size: isRim ? (Math.random() * 0.6 + 0.85) : (Math.random() * 0.6 + 0.75),
          color: redColors[Math.floor(Math.random() * redColors.length)],
          progress: 0,
          speed: 0.0035 + Math.random() * 0.0035,
          delay: Math.random() * 75,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);
        time += 0.03;
        frame++;

        if (!isDragging) {
          rotY += 0.007; // Tự xoay êm ái
        }

        const centerX = width / 2;
        // Đặt tâm tim ở khoảng 38% chiều cao
        const centerY = height * 0.38;

        // Trái tim đập nhẹ
        const beat = 1 + 0.07 * Math.pow(Math.sin(time * 1.3), 8) + 0.015 * Math.sin(time * 2.6);
        
        // Thu nhỏ kích thước tổng thể (~32% so với bản lớn trước đó)
        const scale = (Math.min(width, height) / 56) * beat;

        const fov = 420;
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

        // Hào quang đỏ dịu gọn gàng quanh tim
        const glow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 130 * beat);
        glow.addColorStop(0, 'rgba(255, 0, 51, 0.35)');
        glow.addColorStop(0.5, 'rgba(201, 24, 74, 0.1)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 140 * beat, 0, Math.PI * 2);
        ctx.fill();

        const renderQueue = [];

        // 1. Chiếu các hạt tim 3D
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const ease = 1 - Math.pow(1 - p.progress, 3);

          let x0 = p.origX * scale;
          let y0 = p.origY * scale;
          let z0 = p.origZ * scale;

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const targetProjX = centerX + (x1 * fov) / (fov + z2);
          const targetProjY = centerY + (y2 * fov) / (fov + z2);

          const drawX = p.currX + (targetProjX - p.currX) * ease;
          const drawY = p.currY + (targetProjY - p.currY) * ease;

          const depthRatio = (z2 + 160) / 320;
          const twinkle = 0.85 + 0.15 * Math.sin(time * 3 + p.twinkleOffset);

          renderQueue.push({
            type: 'particle',
            x: drawX,
            y: drawY,
            z: z2,
            size: p.size * (0.65 + 0.45 * depthRatio) * (0.3 + 0.7 * ease),
            color: p.color,
            alpha: Math.max(0.15, Math.min(1, (0.4 + 0.6 * depthRatio) * ease * twinkle))
          });
        }

        // 2. Vành đai chữ 3D - BỐ TRÍ NẰM HOÀN TOÀN DƯỚI ĐÁY TRÁI TIM
        const textCount = ringTexts.length;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusZ = ringRadiusX * 0.95;
        // Đặt vị trí Y của vòng chữ ở khoảng 72% chiều cao màn hình (dưới tim)
        const ringYPos = height * 0.72;

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.35 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          let x0 = cosA * ringRadiusX;
          let y0 = sinA * 14; // Nghiêng nhẹ 3D
          let z0 = sinA * ringRadiusZ;

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const pX = centerX + (x1 * fov) / (fov + z2);
          const pY = ringYPos + (y2 * fov) / (fov + z2);

          const depthRatio = Math.max(0.1, Math.min(1, (z2 + ringRadiusZ) / (2 * ringRadiusZ)));

          renderQueue.push({
            type: 'text',
            text: ringTexts[i],
            x: pX,
            y: pY,
            z: z2,
            depthRatio: depthRatio
          });
        }

        // Sắp xếp thứ tự xa gần (Z-sorting)
        renderQueue.sort((a, b) => a.z - b.z);

        // 3. Vẽ toàn bộ các thành phần
        for (let i = 0; i < renderQueue.length; i++) {
          const item = renderQueue[i];

          if (item.type === 'particle') {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
            ctx.fillStyle = item.color;
            ctx.globalAlpha = item.alpha;
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#ff0033';
            ctx.fill();
          } else if (item.type === 'text') {
            const fontSize = 11.5 + item.depthRatio * 6.5;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.globalAlpha = 0.3 + 0.7 * item.depthRatio;
            ctx.fillStyle = item.depthRatio > 0.6 ? '#ffffff' : '#ffccd5';
            ctx.shadowBlur = item.depthRatio > 0.6 ? 12 : 5;
            ctx.shadowColor = '#ff0033';
            ctx.fillText(item.text, item.x, item.y);
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

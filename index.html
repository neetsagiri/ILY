<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #220316 0%, #030105 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: manipulation;
    }

    /* Đốm sáng đom đóm nền */
    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    /* Khung Phong bì */
    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1s ease, transform 1s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
      padding: 20px;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #870b29;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
      pointer-events: none; /* Để toàn bộ cú chạm rơi thẳng vào envelope-wrapper */
    }

    /* Nắp gập phong bì */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    /* Túi trước che chân bức thư */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #a81236;
      border-right: 130px solid #a81236;
      border-bottom: 100px solid #d41c46;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    /* Con dấu sáp trái tim nổi */
    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.4s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      pointer-events: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* TỜ GIẤY THƯ NẰM LỌT TRONG PHONG BÌ */
    #paper-letter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 236px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
      padding: 16px 14px;
      z-index: 2;
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1), 
                  width 0.8s ease, 
                  height 0.8s ease, 
                  box-shadow 0.8s ease,
                  opacity 0.4s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ead6c3;
      pointer-events: auto;
    }

    /* Giai đoạn 1: Trồi thẳng lên khỏi miệng túi */
    #paper-letter.peeking {
      opacity: 1;
      transform: translateX(-50%) translateY(-135px);
    }

    /* Giai đoạn 2: Tách khỏi phong bì và bung mở ra giữa màn hình */
    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      bottom: auto;
      transform: translate(-50%, -50%) scale(1);
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
      pointer-events: auto;
    }

    /* Khung Canvas Trái Tim 3D */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Lá thư mượt mà -->
  <div id="envelope-wrapper">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <!-- Tờ thư kẹp bên trong phong bì -->
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" id="surpriseBtn">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Canvas Trái tim 3D -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 40; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 4 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      // Tờ giấy trồi thẳng lên
      setTimeout(() => {
        letter.classList.add('peeking');
      }, 550);

      // Tách ra giữa màn hình
      setTimeout(() => {
        letter.classList.remove('peeking');
        letter.classList.add('opened');
      }, 1450);
    }

    // Đăng ký sự kiện mở thư an toàn trên cả điện thoại và máy tính
    const envWrapper = document.getElementById('envelope-wrapper');
    envWrapper.addEventListener('pointerdown', (e) => {
      // Nếu bấm trúng nút trong thư thì bỏ qua
      if (e.target && e.target.id === 'surpriseBtn') return;
      openEnvelope();
    });

    document.getElementById('surpriseBtn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      startHeartShow();
    });

    function startHeartShow() {
      const letter = document.getElementById('paper-letter');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        init3DVolumetricHeart();
      }, 850);
    }

    /* Thuật toán tạo khối quả cầu Trái tim 3D (3D Volumetric Heart) */
    function init3DVolumetricHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const heartParticles = [];
      const centerYOffset = -2.5;
      const layers = [1.0, 0.96, 0.92, 0.86, 0.80, 0.74, 0.68, 0.62, 0.55, 0.48, 0.40, 0.32, 0.24, 0.15];

      layers.forEach((layerScale) => {
        const count = Math.floor(95 * Math.pow(layerScale, 0.6));
        const maxZ = Math.sqrt(Math.max(0, 1 - layerScale * layerScale)) * 9.5;

        for (let i = 0; i < count; i++) {
          const t = (Math.PI * 2 * i) / count;
          const base = heartCurve(t);

          const finalX = base.x * layerScale;
          const finalY = (base.y - centerYOffset) * layerScale + centerYOffset;
          const zSign = (i % 2 === 0) ? 1 : -1;
          const finalZ = zSign * maxZ * (0.8 + Math.random() * 0.4);

          const angle = Math.random() * Math.PI * 2;
          const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

          heartParticles.push({
            origX: finalX,
            origY: finalY,
            origZ: finalZ,
            currX: width / 2 + Math.cos(angle) * dist,
            currY: height / 2 + Math.sin(angle) * dist,
            baseSize: Math.random() * 1.5 + 1.2,
            progress: 0,
            speed: 0.0035 + Math.random() * 0.003,
            delay: Math.random() * 95,
            phase: Math.random() * Math.PI * 2
          });
        }
      });

      const ringParticles = [];
      const ringCount = 220;
      for (let i = 0; i < ringCount; i++) {
        ringParticles.push({
          theta: Math.random() * Math.PI * 2,
          radius: Math.random() * 110 + 60,
          speed: 0.01 + Math.random() * 0.006,
          size: Math.random() * 1.6 + 0.5,
          alpha: Math.random() * 0.6 + 0.3
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.035;
        frame++;

        const centerX = width / 2;
        const centerY = height * 0.36;
        const ringCenterY = height * 0.75;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusY = ringRadiusX * 0.34;

        const beat = 1 + 0.08 * Math.pow(Math.sin(time * 1.2), 8) + 0.02 * Math.sin(time * 2.4);
        const scale = (Math.min(width, height) / 38) * beat;

        const tiltX = 0.22;
        const rotY = Math.sin(time * 0.7) * 0.28;

        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);

        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 150 * beat);
        grad.addColorStop(0, 'rgba(255, 42, 109, 0.4)');
        grad.addColorStop(0.5, 'rgba(255, 77, 109, 0.12)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 160 * beat, 0, Math.PI * 2);
        ctx.fill();

        // 1. Vẽ hạt trái tim 3D
        const sortedParticles = [];

        for (let i = 0; i < heartParticles.length; i++) {
          const p = heartParticles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const x1 = p.origX * cosY + p.origZ * sinY;
          const z1 = -p.origX * sinY + p.origZ * cosY;

          const y2 = p.origY * cosX - z1 * sinX;
          const z2 = p.origY * sinX + z1 * cosX;

          const fov = 42;
          const pScale = fov / (fov + z2);

          const floatOffset = (p.progress >= 1) ? Math.sin(time * 2 + p.phase) * 0.8 : 0;
          const targetX = centerX + x1 * scale * pScale + floatOffset;
          const targetY = centerY + y2 * scale * pScale + floatOffset;

          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          sortedParticles.push({
            drawX,
            drawY,
            z: z2,
            pScale,
            ease,
            baseSize: p.baseSize
          });
        }

        sortedParticles.sort((a, b) => a.z - b.z);

        for (let i = 0; i < sortedParticles.length; i++) {
          const sp = sortedParticles[i];
          const depthRatio = (sp.z + 12) / 24; 
          const clampedDepth = Math.max(0.1, Math.min(1, depthRatio));

          ctx.beginPath();
          ctx.arc(sp.drawX, sp.drawY, sp.baseSize * sp.pScale * (0.5 + 0.5 * sp.ease), 0, Math.PI * 2);
          
          if (clampedDepth > 0.65) {
            ctx.fillStyle = '#ff3366';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff2a6d';
          } else {
            ctx.fillStyle = '#d91b48';
            ctx.shadowBlur = 2;
            ctx.shadowColor = '#b31238';
          }

          ctx.globalAlpha = (0.25 + 0.75 * clampedDepth) * sp.ease;
          ctx.fill();
        }

        // 2. Vẽ đĩa hạt chân đế
        for (let i = 0; i < ringParticles.length; i++) {
          const rp = ringParticles[i];
          rp.theta += rp.speed;

          const rx = centerX + Math.cos(rp.theta) * (rp.radius * (ringRadiusX / 140));
          const ry = ringCenterY + Math.sin(rp.theta) * (ringRadiusY / 140));
          const zDepth = (Math.sin(rp.theta) + 1) / 2;

          ctx.beginPath();
          ctx.arc(rx, ry, rp.size * (0.6 + 0.5 * zDepth), 0, Math.PI * 2);
          ctx.fillStyle = '#ff758c';
          ctx.shadowBlur = 5;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = rp.alpha * (0.3 + 0.7 * zDepth);
          ctx.fill();
        }

        // 3. Vẽ đĩa chữ 3D xoay tròn
        const textCount = ringTexts.length;
        const sortedTexts = [];

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.4 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          const tx = centerX + cosA * ringRadiusX;
          const ty = ringCenterY + sinA * ringRadiusY;
          const zDepth = (sinA + 1) / 2;

          sortedTexts.push({
            text: ringTexts[i],
            x: tx,
            y: ty,
            z: zDepth,
            depthRatio: zDepth
          });
        }

        sortedTexts.sort((a, b) => a.z - b.z);

        for (let i = 0; i < sortedTexts.length; i++) {
          const item = sortedTexts[i];
          const fontSize = 11.5 + item.depthRatio * 6.5;

          ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.globalAlpha = 0.35 + 0.65 * item.depthRatio;
          ctx.fillStyle = item.depthRatio > 0.65 ? '#ffffff' : '#ffccd5';
          ctx.shadowBlur = item.depthRatio > 0.65 ? 14 : 6;
          ctx.shadowColor = '#ff2a6d';

          ctx.fillText(item.text, item.x, item.y);
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

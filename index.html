
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #240215 0%, #040106 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Lá thư -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei cố lên nhaaa 
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Canvas Trái tim 3D -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 25; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 3 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.2) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -35px) scale(0.2)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 600);
      }
    });

    const music = document.getElementById('bg-music');

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      // Dừng chuyển động bập bênh của phong bì để lá thư cố định ngay ngắn giữa màn hình
      const envWrapper = document.getElementById('envelope-wrapper');
      if (envWrapper) envWrapper.style.animation = 'none';

      music.play().catch(() => {});

      const heartSeal = document.getElementById('heartSeal');
      if (heartSeal) {
        heartSeal.style.opacity = '0';
        heartSeal.style.pointerEvents = 'none';
      }
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
        letter.style.transform = ''; // Xóa inline transform để class .opened căn giữa màn hình
      }, 1100);
    }

    function startHeartShow(e) {
      if (e) e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      fireflyContainer.style.display = 'none';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initCrispHeart();
      }, 850);
    }

    function initCrispHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.3 + 0.5,
          twinkleSpeed: 0.02 + Math.random() * 0.03,
          phase: Math.random() * Math.PI * 2
        });
      }

      // ================= HỆ THỐNG MƯA SAO BĂNG (METEOR SHOWER) =================
      const meteors = [];
      function spawnMeteor() {
        const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.18; // Rơi chéo góc dịu dàng
        meteors.push({
          x: Math.random() * (width * 1.3) - width * 0.15,
          y: -30 - Math.random() * 80,
          len: Math.random() * 70 + 45,
          speed: Math.random() * 0.8 + 1.2, // Giảm tốc độ để sao băng lướt thật chậm rãi
          size: Math.random() * 1.4 + 1.1,
          angle: angle,
          dx: Math.cos(angle),
          dy: Math.sin(angle),
          opacity: 1,
          decay: Math.random() * 0.0015 + 0.0012 // Vệt sao sáng lâu hơn khi trôi chậm
        });
      }

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // ================= CƠ CHẾ XOAY BẰNG TAY (INTERACTIVE 3D ROTATION) =================
      let rotX = 0.05;
      let rotY = 0;
      let velX = 0;
      let velY = 0;
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        velX = 0;
        velY = 0;
        canvas.style.cursor = 'grabbing';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        // Cập nhật góc xoay trực tiếp theo chuyển động vuốt
        velY = dx * 0.007;
        velX = -dy * 0.007;

        rotY += velY;
        rotX += velX;

        // Giới hạn góc ngửa lên / cúi xuống để không bị lộn ngược
        rotX = Math.max(-Math.PI * 0.46, Math.min(Math.PI * 0.46, rotX));
      });

      const handlePointerUp = () => {
        if (isDragging) {
          isDragging = false;
          canvas.style.cursor = 'grab';
        }
      };

      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerUp);

      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      // ================= CẤU TRÚC 1.500 HẠT 3D KHỐI LIỀN MẠCH =================
      const TOTAL_HEART = 1500;
      const STRIDE = 10;
      const data = new Float32Array(TOTAL_HEART * STRIDE);
      const centerYOffset = -2.5;

      for (let i = 0; i < TOTAL_HEART; i++) {
        const idx = i * STRIDE;
        let finalX, finalY, z3d, size;

        if (i < 420) {
          // 420 hạt định hình đường viền mép (rim): vuốt mỏng dần về trục Z = 0
          // để hai mặt trước-sau khép kín liền mạch như gối đệm 3D, không còn mép cắt thẳng
          const t = (Math.PI * 2 * i) / 420;
          const pt = heartCurve(t);
          const r = 0.95 + Math.random() * 0.05;
          finalX = pt.x * r;
          finalY = (pt.y - centerYOffset) * r + centerYOffset;
          z3d = (Math.random() - 0.5) * 2.2;
          size = Math.random() * 0.5 + 1.4;
        } else if (i < 1180) {
          // 760 hạt bao quanh lớp vỏ phồng 3D (Surface Shell) theo hàm elip elipsoid
          const t = Math.PI * 2 * Math.random();
          const pt = heartCurve(t);
          const r = Math.sqrt(0.2 + 0.8 * Math.random());
          finalX = pt.x * r;
          finalY = (pt.y - centerYOffset) * r + centerYOffset;
          
          // Độ phồng vòm cong Z cực đại ở thân tim và vuốt êm về 0 ở mép viền
          const envelope = Math.sqrt(Math.max(0, 1 - r * r)) * 9.8;
          const sign = Math.random() > 0.5 ? 1 : -1;
          z3d = sign * envelope * (0.65 + 0.35 * Math.random());
          size = Math.random() * 0.6 + 1.3;
        } else {
          // 320 hạt lấp đầy thể tích bên trong ruột tim
          const t = Math.PI * 2 * Math.random();
          const pt = heartCurve(t);
          const r = Math.pow(Math.random(), 0.6);
          finalX = pt.x * r;
          finalY = (pt.y - centerYOffset) * r + centerYOffset;
          const envelope = Math.sqrt(Math.max(0, 1 - r * r)) * 9.8;
          z3d = (Math.random() * 2 - 1) * envelope * 0.65;
          size = Math.random() * 0.5 + 1.1;
        }

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

        data[idx + 0] = finalX;
        data[idx + 1] = finalY;
        data[idx + 2] = z3d;
        data[idx + 3] = width / 2 + Math.cos(angle) * dist;
        data[idx + 4] = height / 2 + Math.sin(angle) * dist;
        data[idx + 5] = size;
        data[idx + 6] = Math.random() * Math.PI * 2; // Góc pha dao động riêng biệt của từng hạt
        data[idx + 7] = 0; // progress
        data[idx + 8] = 0.0009 + Math.random() * 0.0006; // Tốc độ tụ lại cực chậm và thư thái
        data[idx + 9] = Math.random() * 150; // Kéo dãn độ trễ để các hạt xuất hiện lần lượt
      }

      // Đĩa xoay chân đế - giảm tốc độ xoay chậm dịu dàng
      const ringCount = 80;
      const ringParticles = [];
      for (let i = 0; i < ringCount; i++) {
        ringParticles.push({
          theta: Math.random() * Math.PI * 2,
          radius: Math.random() * 110 + 60,
          speed: 0.0018 + Math.random() * 0.0015,
          size: Math.random() * 1.2 + 1.2
        });
      }

      let time = 0;
      let frame = 0;
      let textAngleOffset = 0; // Góc xoay chữ tịnh tiến mượt mà

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.035;
        frame++;
        textAngleOffset += 0.0022; // Chữ trôi rất chậm và nhẹ nhàng quanh quỹ đạo

        const centerX = width / 2;
        const centerY = height * 0.35;
        const ringCenterY = height * 0.76;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusY = ringRadiusX * 0.34;

        // Trái tim giữ kích thước cố định, không còn phập phồng co giãn
        const scale = Math.min(width, height) / 38;

        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 150);
        grad.addColorStop(0, 'rgba(255, 42, 109, 0.38)');
        grad.addColorStop(0.5, 'rgba(255, 77, 109, 0.08)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
        ctx.fill();

        // Sao nền
        ctx.fillStyle = '#ffccd5';
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const tw = (Math.sin(time * 25 * s.twinkleSpeed + s.phase) + 1) / 2;
          ctx.globalAlpha = 0.2 + 0.6 * tw;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }

        // ================= HIỆU ỨNG MƯA SAO BĂNG =================
        if (Math.random() < 0.045) { // Tần suất xuất hiện sao băng vừa vặn, không quá dày
          spawnMeteor();
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.x += m.dx * m.speed;
          m.y += m.dy * m.speed;
          m.opacity -= m.decay;

          if (m.opacity <= 0 || m.x > width + 120 || m.y > height + 120) {
            meteors.splice(i, 1);
            continue;
          }

          const tailX = m.x - m.dx * m.len;
          const tailY = m.y - m.dy * m.len;

          const mGrad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
          mGrad.addColorStop(0, 'rgba(255, 117, 140, 0)');
          mGrad.addColorStop(0.65, `rgba(255, 145, 175, ${m.opacity * 0.6})`);
          mGrad.addColorStop(1, `rgba(255, 255, 255, ${m.opacity})`);

          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(m.x, m.y);
          ctx.strokeStyle = mGrad;
          ctx.lineWidth = m.size;
          ctx.lineCap = 'round';
          ctx.stroke();

          // Đầu sao băng phát sáng lấp lánh
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.size * 1.1, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${m.opacity})`;
          ctx.fill();
        }

        // ================= GÓC XOAY 3D THEO THAO TÁC CỦA NGƯỜI DÙNG =================
        // Trái tim không tự chuyển động. Khi buông tay, quán tính giảm dần êm ái
        if (!isDragging) {
          rotY += velY;
          rotX += velX;
          velY *= 0.94; // Giảm tốc độ từ từ
          velX *= 0.94;
        }

        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosZ = 1, sinZ = 0;

        const cameraZ = 280;

        // Chia 4 dải độ sâu Z liên tục (Depth Shading) thay vì chia 2 nửa nhị phân
        // Giúp ánh sáng chuyển mượt từ sau ra trước mà không bị ranh giới cắt đôi
        const pathDeepBack = new Path2D();
        const pathMidBack = new Path2D();
        const pathMidFront = new Path2D();
        const pathHighFront = new Path2D();

        for (let i = 0; i < TOTAL_HEART; i++) {
          const idx = i * STRIDE;

          if (frame > data[idx + 9] && data[idx + 7] < 1) {
            data[idx + 7] += data[idx + 8];
            if (data[idx + 7] > 1) data[idx + 7] = 1;
          }

          const origX = data[idx + 0];
          const origY = data[idx + 1];
          const origZ = data[idx + 2];
          const currX = data[idx + 3];
          const currY = data[idx + 4];
          const pSize = data[idx + 5];
          const pPhase = data[idx + 6];
          const progress = data[idx + 7];

          // Chuyển động tích tụ vào tim bằng hàm Quartic Ease-Out siêu mượt
          const ease = 1 - Math.pow(1 - progress, 4);

          // Dao động vi mô bồng bềnh độc lập theo 3 trục x, y, z
          // Hạt ở viền ngoài dao động nhẹ hơn để giữ khung viền sắc nét
          const isBorder = i < 420;
          const floatAmp = (isBorder ? 0.16 : 0.32) * ease;
          const driftX = Math.sin(time * 0.7 + pPhase) * floatAmp;
          const driftY = Math.cos(time * 0.55 + pPhase * 1.3) * floatAmp;
          const driftZ = Math.sin(time * 0.65 + pPhase * 0.8) * (floatAmp * 1.3);

          const posX = origX + driftX;
          const posY = origY + driftY;
          const posZ = origZ + driftZ;

          // 1. Phép biến đổi ma trận xoay 3D 3 trục
          const x1 = posX * cosY + posZ * sinY;
          const z1 = -posX * sinY + posZ * cosY;

          const y2 = posY * cosX - z1 * sinX;
          const z2 = posY * sinX + z1 * cosX;

          const x3 = x1 * cosZ - y2 * sinZ;
          const y3 = x1 * sinZ + y2 * cosZ;
          const z3 = z2;

          // 2. Phép chiếu phối cảnh chuẩn
          const perspective = cameraZ / (cameraZ + z3 * 1.9);
          const targetX = centerX + x3 * scale * perspective;
          const targetY = centerY + y3 * scale * perspective;

          // Chuyển động tích tụ vào tim bằng hàm Quartic Ease-Out
          const drawX = currX + (targetX - currX) * ease;
          const drawY = currY + (targetY - currY) * ease;
          const r = pSize * perspective * (0.6 + 0.4 * ease);

          // Phân loại hạt vào các dải chiều sâu để chuyển màu mượt mà
          if (z3 < -3.5) {
            pathDeepBack.moveTo(drawX + r, drawY);
            pathDeepBack.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else if (z3 < 0) {
            pathMidBack.moveTo(drawX + r, drawY);
            pathMidBack.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else if (z3 < 3.5) {
            pathMidFront.moveTo(drawX + r, drawY);
            pathMidFront.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else {
            pathHighFront.moveTo(drawX + r, drawY);
            pathHighFront.arc(drawX, drawY, r, 0, Math.PI * 2);
          }
        }

        // Lớp 1: Mặt sau xa nhất - đỏ rượu vang sẫm
        ctx.fillStyle = '#800828';
        ctx.globalAlpha = 0.42;
        ctx.fill(pathDeepBack);

        // Lớp 2: Lưng tim trung gian - đỏ nhung trầm
        ctx.fillStyle = '#b81442';
        ctx.globalAlpha = 0.68;
        ctx.fill(pathMidBack);

        // Lớp 3: Mặt trước rực rỡ - hồng đỏ neon
        ctx.fillStyle = '#ff2a6d';
        ctx.globalAlpha = 0.88;
        ctx.fill(pathMidFront);

        // Lớp 4: Đỉnh nổi trước nhất - hồng sáng bắt sáng
        ctx.fillStyle = '#ff6584';
        ctx.globalAlpha = 0.98;
        ctx.fill(pathHighFront);

        // ================= ĐĨA HẠT XOAY CHÂN ĐẾ =================
        const ringPath = new Path2D();
        for (let i = 0; i < ringParticles.length; i++) {
          const rp = ringParticles[i];
          rp.theta += rp.speed;

          const rx = centerX + Math.cos(rp.theta) * (rp.radius * (ringRadiusX / 140));
          const ry = ringCenterY + Math.sin(rp.theta) * (rp.radius * (ringRadiusY / 140));
          ringPath.moveTo(rx + rp.size, ry);
          ringPath.arc(rx, ry, rp.size, 0, Math.PI * 2);
        }
        ctx.fillStyle = '#ff758c';
        ctx.globalAlpha = 0.6;
        ctx.fill(ringPath);

        // ================= ĐĨA CHỮ XOAY CHÂN ĐẾ (XOAY MƯỢT VÀ ĐỀU) =================
        const textCount = ringTexts.length;
        const sortedTexts = [];

        // Góc chia đều đặn tuyệt đối quanh chu vi elip
        for (let i = 0; i < textCount; i++) {
          const angle = textAngleOffset + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          sortedTexts.push({
            text: ringTexts[i],
            x: centerX + cosA * ringRadiusX,
            y: ringCenterY + sinA * ringRadiusY,
            z: (sinA + 1) / 2
          });
        }

        sortedTexts.sort((a, b) => a.z - b.z);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Cố định font 1 lần để tránh giật lag rasterize glyphs trên mobile
        ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        for (let i = 0; i < sortedTexts.length; i++) {
          const item = sortedTexts[i];
          const textScale = 0.72 + item.z * 0.38;

          ctx.save();
          ctx.translate(item.x, item.y);
          ctx.scale(textScale, textScale);
          ctx.globalAlpha = 0.32 + 0.68 * item.z;
          ctx.fillStyle = item.z > 0.65 ? '#ffffff' : '#ffccd5';
          ctx.fillText(item.text, 0, 0);
          ctx.restore();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

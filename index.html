<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #2a0219 0%, #0c020d 55%, #030005 100%);
      overflow: hidden;
      font-family: 'Quicksand', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg-firefly {
      position: absolute;
      background: radial-gradient(circle, #fff 0%, #ff758f 60%, transparent 100%);
      border-radius: 50%;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 117, 143, 0.9));
      animation: floatFirefly 5.5s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.2; }
      50% { transform: translateY(-28px) scale(1.35); opacity: 0.95; }
    }

    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
      animation: floatEnvelope 3.6s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .envelope {
      position: relative;
      width: 280px;
      height: 180px;
      background: linear-gradient(145deg, #870b29, #a81238);
      border-radius: 0 0 18px 18px;
      box-shadow: 0 25px 60px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
      z-index: 2;
    }

    .envelope-pocket-back {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 280px;
      height: 180px;
      background: #75061f;
      border-radius: 0 0 18px 18px;
      z-index: 1;
    }

    #paper-letter {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 380px;
      min-height: 290px;
      background: #fffdfa;
      background-image: repeating-linear-gradient(#fffdfa, #fffdfa 29px, #fae1d6 30px);
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 45px rgba(255, 77, 109, 0.45);
      padding: 30px 26px;
      z-index: 100;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
      transition: transform 0.8s cubic-bezier(0.2, 0.85, 0.25, 1), opacity 0.5s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 115px solid #ce1c43;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 40;
    }

    .envelope-pocket-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid #b31439;
      border-right: 140px solid #b31439;
      border-bottom: 106px solid #df204c;
      border-radius: 0 0 18px 18px;
      z-index: 25;
      pointer-events: none;
    }

    .heart-seal {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: radial-gradient(circle, #fff0f3 0%, #ff4d6d 65%, #8f0624 100%);
      border-radius: 50%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      z-index: 45;
      animation: pulse 1.6s infinite;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffe5ec;
      font-size: 1.25rem;
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 16px rgba(255, 77, 109, 0.9);
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.88rem;
      color: #ff85a1;
      opacity: 0.9;
      letter-spacing: 0.8px;
    }

    .paper-header {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.15rem;
      line-height: 1.8;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      min-height: 70px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 13px 30px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(201, 24, 74, 0.55);
      align-self: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .surprise-btn:active {
      transform: scale(0.95);
    }

    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.8s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #morphBtn {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 42, 109, 0.32);
      border: 1.5px solid rgba(255, 160, 185, 0.8);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px 32px;
      border-radius: 35px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 35px rgba(255, 42, 109, 0.5);
      z-index: 200;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }

    #morphBtn:active {
      transform: translateX(-50%) scale(0.94);
      background: rgba(255, 42, 109, 0.55);
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }
  </style>
</head>
<body>
  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <audio id="galaxy-music" src="audio1.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-pocket-back"></div>
      <div class="envelope-flap" id="envFlap"></div>
      <div class="envelope-pocket-front"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong bì để mở thư ✨)</span>
  </div>

  <div id="paper-letter">
    <div style="font-size: 34px; text-align: center; margin-bottom: 4px;">💌</div>
    <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
    <div class="paper-body" id="letterText"></div>
    <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
  </div>

  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
    <button id="morphBtn" onclick="toggleMorph(event)">Biến thành dải ngân hà 🌌</button>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 30; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 3.5 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 5.5 + 's';
      fireflyContainer.appendChild(fly);
    }

    let isOpened = false;
    const music = document.getElementById('bg-music');
    const galaxyMusic = document.getElementById('galaxy-music');

    function typeWriterEffect(text, elementId, speed = 40) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.innerHTML = "";
      let i = 0;
      function type() {
        if (i < text.length) {
          if (text.substr(i, 4) === "<br>") {
            el.innerHTML += "<br>";
            i += 4;
          } else {
            el.innerHTML += text.charAt(i);
            i++;
          }
          setTimeout(type, speed);
        }
      }
      type();
    }

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      music.play().catch(() => {});

      const envWrapper = document.getElementById('envelope-wrapper');
      envWrapper.style.animation = 'none';

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('heartSeal').style.transform = 'translate(-50%, -50%) scale(0.2)';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.classList.add('opened');
        typeWriterEffect("Bé iuu Bảo Bei Nhất trên đời 💕<br>Bảo Bei bấm vào nút bên dưới nhé...", "letterText", 45);
      }, 500);
    }

    function startHeartShow(e) {
      if (e) e.stopPropagation();
      music.play().catch(() => {});

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 1s cubic-bezier(0.25, 1, 0.5, 1)';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.6)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.6)';

      fireflyContainer.style.display = 'none';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        letter.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        requestAnimationFrame(() => hw.style.opacity = '1');
        initCrispHeart();
      }, 900);
    }

    let toggleMorph = null;

    function initCrispHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      let width = 0;
      let height = 0;
      const cameraZ = 280;
      let time = 0;
      let frame = 0;
      let textAngleOffset = 0;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      const stars = [];
      for (let i = 0; i < 110; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.6 + 0.4,
          twinkleSpeed: 0.02 + Math.random() * 0.035,
          phase: Math.random() * Math.PI * 2
        });
      }

      const shootingStars = [];
      function spawnShootingStar() {
        shootingStars.push({
          x: Math.random() * width * 0.9 + width * 0.05,
          y: Math.random() * (height * 0.35),
          len: Math.random() * 90 + 50,
          speed: Math.random() * 1.4 + 1.4,
          angle: (Math.PI / 4) + (Math.random() - 0.5) * 0.15,
          opacity: 1
        });
      }

      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const TOTAL_HEART = 2200;
      const STRIDE = 10;
      const data = new Float32Array(TOTAL_HEART * STRIDE);
      
      const galRadius = new Float32Array(TOTAL_HEART);
      const galBaseAngle = new Float32Array(TOTAL_HEART);
      const galHeight = new Float32Array(TOTAL_HEART);
      const galOrbitalSpeed = new Float32Array(TOTAL_HEART);
      const galCurrentAngle = new Float32Array(TOTAL_HEART);

      const galaxyHearts = [];
      const heartSymbols = ['💖', '💕', '✨', '♥', '💗', '🌸'];
      for (let i = 0; i < 40; i++) {
        const arm = i % 3;
        const r = 4.2 + Math.pow(Math.random(), 0.8) * 21.0;
        const baseAngle = (arm * Math.PI * 2) / 3 + 1.85 * Math.log(r * 0.36 + 1) + (Math.random() - 0.5) * 0.55;
        galaxyHearts.push({
          symbol: heartSymbols[Math.floor(Math.random() * heartSymbols.length)],
          r: r,
          angle: baseAngle,
          height: (Math.random() - 0.5) * 2.6,
          speed: 0.0075 / Math.sqrt(r * 0.35 + 1.1),
          baseSize: Math.random() * 8 + 12,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }

      const dispX = new Float32Array(TOTAL_HEART);
      const dispY = new Float32Array(TOTAL_HEART);
      const dispZ = new Float32Array(TOTAL_HEART);
      const velDispX = new Float32Array(TOTAL_HEART);
      const velDispY = new Float32Array(TOTAL_HEART);
      const velDispZ = new Float32Array(TOTAL_HEART);

      const centerYOffset = -2.5;

      function generateGalaxyPoints() {
        const arms = 3;
        const maxRadius = 26.0;

        for (let i = 0; i < TOTAL_HEART; i++) {
          const isCoreBulge = i < 520;
          let r, finalAngle, heightY;

          if (isCoreBulge) {
            r = Math.pow(Math.random(), 1.5) * 5.8;
            finalAngle = Math.random() * Math.PI * 2;
            const coreVerticalScale = Math.sqrt(Math.max(0, 1 - Math.pow(r / 5.8, 2))) * 2.6;
            heightY = (Math.random() - 0.5) * coreVerticalScale;
          } else {
            const armIndex = i % arms;
            const armOffset = (armIndex * Math.PI * 2) / arms;
            const normDist = Math.pow(Math.random(), 0.82);
            r = 3.2 + normDist * (maxRadius - 3.2);

            const spiralAngle = armOffset + 1.85 * Math.log(r * 0.36 + 1);
            const armScatter = (Math.random() - 0.5) * (0.7 + (r / maxRadius) * 1.5);
            finalAngle = spiralAngle + armScatter;

            const discThickness = Math.max(0.4, (1 - r / maxRadius) * 2.2);
            heightY = (Math.random() - 0.5) * discThickness;
          }

          galRadius[i] = r;
          galBaseAngle[i] = finalAngle;
          galCurrentAngle[i] = finalAngle;
          galHeight[i] = heightY;
          galOrbitalSpeed[i] = 0.0075 / (Math.sqrt(r * 0.32 + 1.2));
        }
      }

      generateGalaxyPoints();

      for (let i = 0; i < TOTAL_HEART; i++) {
        const idx = i * STRIDE;
        const t = Math.PI * 2 * Math.random();
        const pt = heartCurve(t);

        const isBorder = i < 720;
        const r = isBorder ? (0.86 + Math.random() * 0.14) : Math.pow(Math.random(), 0.55);

        const heartThickness = Math.sqrt(Math.max(0, 1 - r * r)) * 9.5;
        const z3d = (Math.random() * 2 - 1) * heartThickness;

        const finalX = pt.x * r;
        const finalY = (pt.y - centerYOffset) * r + centerYOffset;

        const size = isBorder ? (Math.random() * 0.45 + 1.45) : (Math.random() * 0.55 + 1.2);
        const colorType = isBorder ? 0 : 1;

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

        data[idx + 0] = finalX;
        data[idx + 1] = finalY;
        data[idx + 2] = z3d;
        data[idx + 3] = width / 2 + Math.cos(angle) * dist;
        data[idx + 4] = height / 2 + Math.sin(angle) * dist;
        data[idx + 5] = size;
        data[idx + 6] = colorType;
        data[idx + 7] = 0;
        data[idx + 8] = 0.0004 + Math.random() * 0.0003;
        data[idx + 9] = Math.random() * 95;
      }

      let rotY = 0, rotX = 0;
      let velY = 0, velX = 0;
      let lastPointerX = 0, lastPointerY = 0;

      let isGalaxyMode = false;
      let morphProgress = 0;
      let smoothMorph = 0;

      const activeTouches = new Map();

      function triggerMultiTouchDisperse(touchesMap) {
        const curScale = Math.min(width, height) / (38 - smoothMorph * 12);
        const curCenterY = height * (0.35 * (1 - smoothMorph) + 0.46 * smoothMorph);
        const curCenterX = width / 2;
        const radius = 100;

        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

        for (let i = 0; i < TOTAL_HEART; i++) {
          const idx = i * STRIDE;
          const rCur = galRadius[i];
          const curAng = galCurrentAngle[i];

          const gx = Math.cos(curAng) * rCur;
          const gy = galHeight[i];
          const gz = Math.sin(curAng) * rCur;

          const origX = data[idx + 0] * (1 - smoothMorph) + gx * smoothMorph;
          const origY = data[idx + 1] * (1 - smoothMorph) + gy * smoothMorph;
          const origZ = data[idx + 2] * (1 - smoothMorph) + gz * smoothMorph;

          const x1 = origX * cosY + origZ * sinY;
          const z1 = -origX * sinY + origZ * cosY;
          const y2 = origY * cosX - z1 * sinX;
          const z2 = origY * sinX + z1 * cosX;

          const perspective = cameraZ / Math.max(40, (cameraZ + z2 * 1.8));
          const px = curCenterX + x1 * curScale * perspective;
          const py = curCenterY + y2 * curScale * perspective;

          for (const [id, tObj] of touchesMap.entries()) {
            const dx = px - tObj.x;
            const dy = py - tObj.y;
            const d = Math.hypot(dx, dy);

            if (d < radius) {
              const factor = 1 - d / radius;
              const force = Math.sin(factor * Math.PI * 0.5) * 0.7;
              const ang = Math.atan2(dy, dx);
              velDispX[i] += Math.cos(ang) * force;
              velDispY[i] += Math.sin(ang) * force;
              velDispZ[i] += (Math.random() - 0.5) * force * 0.4;
            }
          }
        }
      }

      let isDragging = false;
      canvas.addEventListener('touchstart', (e) => {
        isDragging = true;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
        }
        if (e.touches.length > 0) {
          lastPointerX = e.touches[0].clientX;
          lastPointerY = e.touches[0].clientY;
          velY = 0; velX = 0;
        }
        triggerMultiTouchDisperse(activeTouches);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length > 0) {
          const dx = e.touches[0].clientX - lastPointerX;
          const dy = e.touches[0].clientY - lastPointerY;
          velY = dx * 0.0045;
          velX = -dy * 0.0045;
          rotY += velY;
          rotX += velX;
          rotX = Math.max(-0.85, Math.min(0.85, rotX));
          lastPointerX = e.touches[0].clientX;
          lastPointerY = e.touches[0].clientY;
        }
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (activeTouches.has(t.identifier)) {
            activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
          }
        }
        triggerMultiTouchDisperse(activeTouches);
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          activeTouches.delete(e.changedTouches[i].identifier);
        }
        if (e.touches.length === 0) isDragging = false;
      }, { passive: true });

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        velY = 0; velX = 0;
        triggerMultiTouchDisperse(new Map([[1, { x: e.clientX, y: e.clientY }]]));
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - lastPointerX;
          const dy = e.clientY - lastPointerY;
          velY = dx * 0.0045;
          velX = -dy * 0.0045;
          rotY += velY;
          rotX += velX;
          rotX = Math.max(-0.85, Math.min(0.85, rotX));
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
          triggerMultiTouchDisperse(new Map([[1, { x: e.clientX, y: e.clientY }]]));
        }
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      toggleMorph = function(e) {
        if (e) e.stopPropagation();
        isGalaxyMode = !isGalaxyMode;

        const btn = document.getElementById('morphBtn');
        btn.innerText = isGalaxyMode ? "Trở về trái tim 💕" : "Biến thành dải ngân hà 🌌";

        if (isGalaxyMode) {
          music.pause();
          galaxyMusic.play().catch(() => {});
        } else {
          galaxyMusic.pause();
          music.play().catch(() => {});
        }
      };

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.02;
        frame++;
        textAngleOffset += 0.0016;

        if (Math.random() < 0.01) {
          spawnShootingStar();
        }

        if (!isDragging) {
          if (isGalaxyMode) {
            rotY += (0.62 - rotY) * 0.012;
            rotX += (-0.68 - rotX) * 0.012;
          } else {
            rotY += (0 - rotY) * 0.022;
            rotX += (0 - rotX) * 0.022;
          }
          velY = 0; velX = 0;
        }

        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

        const targetMorph = isGalaxyMode ? 1 : 0;
        morphProgress += (targetMorph - morphProgress) * 0.006;
        smoothMorph = morphProgress * morphProgress * (3 - 2 * morphProgress);

        const centerX = width / 2;
        const centerY = height * (0.35 * (1 - smoothMorph) + 0.46 * smoothMorph);
        const ringCenterY = height * 0.63;
        const ringRadiusX = Math.min(width * 0.44, 190);
        const ringRadiusY = ringRadiusX * 0.34;
        const scale = Math.min(width, height) / (38 - smoothMorph * 12);

        // Quầng sáng trung tâm ổn định
        const coreR = 135 + smoothMorph * 110;
        const gradCore = ctx.createRadialGradient(centerX, centerY, 4, centerX, centerY, coreR);
        gradCore.addColorStop(0, smoothMorph > 0.5 ? 'rgba(255, 77, 109, 0.45)' : 'rgba(255, 42, 109, 0.4)');
        gradCore.addColorStop(0.3, smoothMorph > 0.5 ? 'rgba(224, 30, 90, 0.25)' : 'rgba(255, 77, 109, 0.12)');
        gradCore.addColorStop(0.7, smoothMorph > 0.5 ? 'rgba(140, 10, 65, 0.1)' : 'rgba(0, 0, 0, 0)');
        gradCore.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradCore;
        ctx.beginPath();
        ctx.arc(centerX, centerY, coreR, 0, Math.PI * 2);
        ctx.fill();

        // Vẽ các biểu tượng emoji trong dải ngân hà (Tối ưu: Bỏ shadowBlur và cache font)
        if (smoothMorph > 0.08) {
          ctx.save();
          ctx.font = '14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          for (let i = 0; i < galaxyHearts.length; i++) {
            const gh = galaxyHearts[i];
            gh.angle += gh.speed;

            const ghX = Math.cos(gh.angle) * gh.r;
            const ghZ = Math.sin(gh.angle) * gh.r;
            const ghY = gh.height;

            const x1 = ghX * cosY + ghZ * sinY;
            const z1 = -ghX * sinY + ghZ * cosY;
            const y2 = ghY * cosX - z1 * sinX;
            const z2 = ghY * sinX + z1 * cosX;

            const persp = cameraZ / Math.max(40, (cameraZ + z2 * 1.8));
            const px = centerX + x1 * scale * persp;
            const py = centerY + y2 * scale * persp;

            const currentAlpha = Math.min(1, Math.max(0, smoothMorph * 0.85 * (persp * 0.9)));
            ctx.globalAlpha = currentAlpha;
            ctx.fillText(gh.symbol, px, py);
          }
          ctx.restore();
        }

        ctx.fillStyle = '#ffb3c1';
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const tw = (Math.sin(time * 25 * s.twinkleSpeed + s.phase) + 1) / 2;
          ctx.globalAlpha = 0.25 + 0.7 * tw;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }

        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const ss = shootingStars[i];
          ss.x += Math.cos(ss.angle) * ss.speed;
          ss.y += Math.sin(ss.angle) * ss.speed;
          ss.opacity -= 0.004;

          if (ss.opacity <= 0) {
            shootingStars.splice(i, 1);
            continue;
          }

          const tailX = ss.x - Math.cos(ss.angle) * ss.len;
          const tailY = ss.y - Math.sin(ss.angle) * ss.len;

          const gradSS = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
          gradSS.addColorStop(0, 'rgba(255, 117, 140, 0)');
          gradSS.addColorStop(1, `rgba(255, 180, 200, ${ss.opacity * 0.9})`);

          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(ss.x, ss.y);
          ctx.strokeStyle = gradSS;
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        // Vẽ các hạt 3D phân lớp độ sâu với hiệu ứng phát quang
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const pathDeepBack = new Path2D();
        const pathMidBack = new Path2D();
        const pathMidFront = new Path2D();
        const pathHighFront = new Path2D();

        for (let i = 0; i < TOTAL_HEART; i++) {
          const idx = i * STRIDE;

          if (frame > data[idx + 9] && data[idx + 7] < 1) {
            data[idx + 7] += data[idx + 8];
            if (data[idx + 7] > 1) data[idx + 7] = 1;
          }

          const progress = data[idx + 7];
          const ease = 1 - Math.pow(1 - progress, 4);

          galCurrentAngle[i] += galOrbitalSpeed[i];
          const rCur = galRadius[i];
          const curAng = galCurrentAngle[i];

          // Tối ưu: Đơn giản hóa phép tính drift để nhẹ CPU
          const pPhase = i * 0.35;
          const naturalDriftX = Math.sin(time + pPhase) * 0.3;
          const naturalDriftY = Math.cos(time + pPhase) * 0.3;
          const naturalDriftZ = Math.sin(time * 0.8 + pPhase) * 0.35;

          const gx = Math.cos(curAng) * rCur;
          const gy = galHeight[i];
          const gz = Math.sin(curAng) * rCur;

          dispX[i] += velDispX[i];
          dispY[i] += velDispY[i];
          dispZ[i] += velDispZ[i];
          velDispX[i] = (velDispX[i] - dispX[i] * 0.03) * 0.91;
          velDispY[i] = (velDispY[i] - dispY[i] * 0.03) * 0.91;
          velDispZ[i] = (velDispZ[i] - dispZ[i] * 0.03) * 0.91;

          const origX = (data[idx + 0] + naturalDriftX) * (1 - smoothMorph) + gx * smoothMorph;
          const origY = (data[idx + 1] + naturalDriftY) * (1 - smoothMorph) + gy * smoothMorph;
          const origZ = (data[idx + 2] + naturalDriftZ) * (1 - smoothMorph) + gz * smoothMorph;

          const currX = data[idx + 3];
          const currY = data[idx + 4];
          const pSize = data[idx + 5];

          const finalOrigX = origX + dispX[i];
          const finalOrigY = origY + dispY[i];
          const finalOrigZ = origZ + dispZ[i];

          const x1 = finalOrigX * cosY + finalOrigZ * sinY;
          const z1 = -finalOrigX * sinY + finalOrigZ * cosY;
          const y2 = finalOrigY * cosX - z1 * sinX;
          const z2 = finalOrigY * sinX + z1 * cosX;

          const perspective = cameraZ / Math.max(40, (cameraZ + z2 * 1.8));
          const targetX = centerX + x1 * scale * perspective;
          const targetY = centerY + y2 * scale * perspective;

          const drawX = currX + (targetX - currX) * ease;
          const drawY = currY + (targetY - currY) * ease;
          const r = (pSize * (1 + smoothMorph * 0.35)) * perspective * (0.65 + 0.35 * ease);

          if (z2 < -3.5) {
            pathDeepBack.moveTo(drawX + r, drawY);
            pathDeepBack.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else if (z2 < 0) {
            pathMidBack.moveTo(drawX + r, drawY);
            pathMidBack.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else if (z2 < 3.5) {
            pathMidFront.moveTo(drawX + r, drawY);
            pathMidFront.arc(drawX, drawY, r, 0, Math.PI * 2);
          } else {
            pathHighFront.moveTo(drawX + r, drawY);
            pathHighFront.arc(drawX, drawY, r, 0, Math.PI * 2);
          }
        }

        ctx.fillStyle = '#9b1137';
        ctx.globalAlpha = 0.55;
        ctx.fill(pathDeepBack);

        ctx.fillStyle = '#c9184a';
        ctx.globalAlpha = 0.75;
        ctx.fill(pathMidBack);

        ctx.fillStyle = '#ff4d6d';
        ctx.globalAlpha = 0.88;
        ctx.fill(pathMidFront);

        ctx.fillStyle = '#ff85a1';
        ctx.globalAlpha = 0.95;
        ctx.fill(pathHighFront);

        ctx.restore();

        // Vẽ vòng chữ xoay tròn (Tối ưu: Bỏ shadowBlur tốn GPU)
        const ringAlphaFade = Math.max(0, 1 - smoothMorph * 1.5);
        if (ringAlphaFade > 0.01) {
          const textCount = ringTexts.length;
          const sortedTexts = [];

          for (let i = 0; i < textCount; i++) {
            const angle = textAngleOffset + (i * 2 * Math.PI) / textCount;
            const sinA = Math.sin(angle);
            const cosA = Math.cos(angle);

            sortedTexts.push({
              text: ringTexts[i],
              x: centerX + cosA * ringRadiusX,
              y: ringCenterY + sinA * ringRadiusY,
              z: (sinA + 1) / 2
            });
          }

          sortedTexts.sort((a, b) => a.z - b.z);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '700 17px "Dancing Script", cursive';

          for (let i = 0; i < sortedTexts.length; i++) {
            const item = sortedTexts[i];
            const textScale = 0.8 + item.z * 0.45;

            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.scale(textScale, textScale);
            ctx.globalAlpha = (0.35 + 0.65 * item.z) * ringAlphaFade;
            ctx.fillStyle = item.z > 0.65 ? '#ffffff' : '#ff9ebb';
            ctx.fillText(item.text, 0, 0);
            ctx.restore();
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #220318 0%, #06010a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Phong bì mở đầu */
    #envelope-wrapper {
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .envelope {
      position: relative;
      width: 200px;
      height: 140px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.45);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .heart-seal {
      font-size: 42px;
    }

    .hint-text {
      margin-top: 22px;
      color: #ffb3c1;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    }

    /* Thiệp tâm tình */
    #letter-card {
      position: absolute;
      width: 86%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 77, 109, 0.35);
      text-align: center;
      z-index: 60;
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #letter-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .letter-title {
      font-size: 1.25rem;
      color: #c9184a;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .letter-content {
      color: #333;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 22px;
      font-weight: 500;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(201, 24, 74, 0.45);
    }

    /* Khu vực hiển thị Trái Tim Emoji */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Chữ chạy phía dưới - căn chỉnh cao hơn mép màn hình */
    .caption-container {
      position: absolute;
      bottom: 11%;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    #lang-text {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 12px #ff4d6d, 0 0 25px #ff0055, 0 0 35px #ff2a6d;
      letter-spacing: 0.8px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(1);
    }

    #sub-text {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #ffccd5;
      text-shadow: 0 0 8px rgba(255, 77, 109, 0.8);
      letter-spacing: 1px;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>

  <!-- Bước 1: Phong bì -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="heart-seal">💌</div>
    </div>
    <div class="hint-text">Gửi Bảo Bei, tình cảm của bé💕</div>
  </div>

  <!-- Bước 2: Thiệp -->
  <div id="letter-card">
    <div class="letter-title">Gửi Bảo Bei của bé 💕</div>
    <div class="letter-content">
      Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
    </div>
    <button class="surprise-btn" onclick="startHeartShow()">Xem điều bất ngờ 💖</button>
  </div>

  <!-- Bước 3: Trái tim đa tầng emoji hoàn hảo -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
    <div class="caption-container">
      <div id="lang-text">Anh yêu Bảo Bei 💕</div>
      <div id="sub-text">Forever with Bảo Bei ✨</div>
    </div>
  </div>

  <script>
    const phrases = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei",
      "愛してる, Bảo Bei",
      "Je t'aime, Bảo Bei",
      "Te amo, Bảo Bei 💕",
      "Ich liebe dich, Bảo Bei",
      "Ti amo, Bảo Bei",
      "Я люблю тебя, Bảo Bei",
      "ฉันรักเธอ, Bảo Bei",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '💕';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    function openEnvelope() {
      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      const env = document.getElementById('envelope-wrapper');
      env.style.opacity = '0';
      env.style.transform = 'scale(0.7)';

      setTimeout(() => {
        env.style.display = 'none';
        const card = document.getElementById('letter-card');
        card.style.display = 'block';
        setTimeout(() => card.classList.add('show'), 20);
      }, 700);
    }

    function startHeartShow() {
      const card = document.getElementById('letter-card');
      card.classList.remove('show');

      setTimeout(() => {
        card.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initPerfectHeart();
        startTextRotation();
      }, 500);
    }

    function startTextRotation() {
      let idx = 0;
      const textEl = document.getElementById('lang-text');
      setInterval(() => {
        textEl.style.opacity = '0';
        textEl.style.transform = 'scale(0.85)';
        setTimeout(() => {
          idx = (idx + 1) % phrases.length;
          textEl.innerText = phrases[idx];
          textEl.style.opacity = '1';
          textEl.style.transform = 'scale(1)';
        }, 350);
      }, 2600);
    }

    /* Thuật toán tạo Trái Tim Emoji Chuẩn Form Cân Đối */
    function initPerfectHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function heartFormula(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const emojis = ['💗', '❤️', '💕', '💖'];
      const particles = [];

      // 1. TẠO VIỀN CHUẨN (Khắc phục hoàn toàn việc bị méo, khuyết cánh)
      const borderCount = 140;
      for (let i = 0; i < borderCount; i++) {
        const t = (Math.PI * 2 * i) / borderCount;
        const pos = heartFormula(t);
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

        particles.push({
          targetRelX: pos.x,
          targetRelY: pos.y,
          currX: width / 2 + Math.cos(angle) * dist,
          currY: height / 2 + Math.sin(angle) * dist,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          size: Math.random() * 4 + 14,
          progress: 0,
          speed: 0.012 + Math.random() * 0.01,
          delay: Math.random() * 45
        });
      }

      // 2. TẠO RUỘT BÊN TRONG THEO TẦNG ĐỒNG TÂM (Đầy đặn, không bị lỗ hổng)
      const layers = [0.2, 0.35, 0.5, 0.65, 0.8, 0.9];
      layers.forEach(layer => {
        const countInLayer = Math.floor(borderCount * layer * 0.8);
        for (let i = 0; i < countInLayer; i++) {
          const t = (Math.PI * 2 * i) / countInLayer + (Math.random() - 0.5) * 0.15;
          const pos = heartFormula(t);
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

          particles.push({
            targetRelX: pos.x * layer,
            targetRelY: pos.y * layer,
            currX: width / 2 + Math.cos(angle) * dist,
            currY: height / 2 + Math.sin(angle) * dist,
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            size: Math.random() * 3 + 12,
            progress: 0,
            speed: 0.01 + Math.random() * 0.012,
            delay: Math.random() * 50
          });
        }
      });

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.045;
        frame++;

        // Nhịp đập Lup-Dup chân thực
        const beat = 1 + 0.09 * Math.pow(Math.sin(time), 8) + 0.03 * Math.sin(time * 2);
        const scale = (Math.min(width, height) / 38) * beat;
        const centerX = width / 2;
        const centerY = height / 2 - 50;

        // Vẽ vầng sáng phát quang trung tâm
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 160 * beat);
        gradient.addColorStop(0, 'rgba(255, 42, 109, 0.25)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 180 * beat, 0, Math.PI * 2);
        ctx.fill();

        // Vẽ từng emoji bay vào form
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const targetX = centerX + p.targetRelX * scale;
          const targetY = centerY + p.targetRelY * scale;

          // Hiệu ứng lướt mượt mà Cubic-Bezier
          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          ctx.font = `${p.size * (0.6 + 0.4 * ease)}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.globalAlpha = Math.min(1, ease + 0.2);
          ctx.fillText(p.emoji, drawX, drawY);
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

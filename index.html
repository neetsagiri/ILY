<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #24051a 0%, #07010c 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Đốm sáng đom đóm & sao bay ngập tràn nền */
    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.5;
      animation: floatFirefly 5s infinite ease-in-out;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    /* Bì thư 3D */
    #envelope-wrapper {
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.8s ease, transform 0.8s ease;
      animation: floatEnvelope 3s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .envelope {
      position: relative;
      width: 250px;
      height: 165px;
      background: #b01037;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 125px solid transparent;
      border-right: 125px solid transparent;
      border-top: 100px solid #d62246;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
      transform-origin: top;
      transition: transform 0.4s ease;
      z-index: 3;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 125px solid #c1123a;
      border-right: 125px solid #c1123a;
      border-bottom: 95px solid #e01e4a;
      border-radius: 0 0 16px 16px;
      z-index: 2;
    }

    .heart-seal {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #a0082a 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      z-index: 4;
      animation: pulse 1.4s infinite;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* Thiệp */
    #letter-card {
      position: absolute;
      width: 86%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 77, 109, 0.35);
      text-align: center;
      z-index: 60;
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #letter-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .letter-title {
      font-size: 1.25rem;
      color: #c9184a;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .letter-content {
      color: #333;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 22px;
      font-weight: 500;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(201, 24, 74, 0.45);
    }

    /* Khung Trái Tim & Môi trường xung quanh */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Chữ chạy phía dưới */
    .caption-container {
      position: absolute;
      bottom: 9%;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    #lang-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 12px #ff4d6d, 0 0 25px #ff0055, 0 0 35px #ff2a6d;
      letter-spacing: 0.8px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(1);
    }

    #sub-text {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #ffccd5;
      text-shadow: 0 0 8px rgba(255, 77, 109, 0.8);
      letter-spacing: 1px;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      <div class="envelope-pocket"></div>
      <div class="heart-seal">❤️</div>
    </div>
    <div class="hint-text">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Thiệp -->
  <div id="letter-card">
    <div class="letter-title">Gửi Bảo Bei của bé 💕</div>
    <div class="letter-content">
      Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
    </div>
    <button class="surprise-btn" onclick="startHeartShow()">Xem điều bất ngờ 💖</button>
  </div>

  <!-- Bước 3: Trái tim đa tầng & bụi sao lấp lánh -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>

    <div class="caption-container">
      <div id="lang-text">Anh yêu Bảo Bei 💕</div>
      <div id="sub-text">Forever with Bảo Bei ✨</div>
    </div>
  </div>

  <script>
    const phrases = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei",
      "愛してる, Bảo Bei",
      "Je t'aime, Bảo Bei",
      "Te amo, Bảo Bei 💕",
      "Ich liebe dich, Bảo Bei",
      "Ti amo, Bảo Bei",
      "Я люблю тебя, Bảo Bei",
      "ฉันรักเธอ, Bảo Bei",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 45; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 4 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 4 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '💕';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    function openEnvelope() {
      const music = document.getElementById('bg-music');
      if (music) music.play().catch(() => {});

      const flap = document.getElementById('envFlap');
      flap.style.transform = 'rotateX(180deg)';

      setTimeout(() => {
        const env = document.getElementById('envelope-wrapper');
        env.style.opacity = '0';
        env.style.transform = 'scale(0.7)';

        setTimeout(() => {
          env.style.display = 'none';
          const card = document.getElementById('letter-card');
          card.style.display = 'block';
          setTimeout(() => card.classList.add('show'), 20);
        }, 600);
      }, 350);
    }

    function startHeartShow() {
      const card = document.getElementById('letter-card');
      card.classList.remove('show');

      setTimeout(() => {
        card.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initPerfectHeart();
        startTextRotation();
      }, 500);
    }

    function startTextRotation() {
      let idx = 0;
      const textEl = document.getElementById('lang-text');
      setInterval(() => {
        textEl.style.opacity = '0';
        textEl.style.transform = 'scale(0.85)';
        setTimeout(() => {
          idx = (idx + 1) % phrases.length;
          textEl.innerText = phrases[idx];
          textEl.style.opacity = '1';
          textEl.style.transform = 'scale(1)';
        }, 350);
      }, 2600);
    }

    /* Thuật toán Trái tim đầy đặn & Bụi sao bay lơ lửng */
    function initPerfectHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      function isInsideHeart(x, y) {
        const nx = x / 16;
        const ny = -y / 16;
        const a = nx * nx + ny * ny - 1;
        return (a * a * a - nx * nx * ny * ny * ny) <= 0;
      }

      const emojis = ['💗', '❤️', '💕', '💖'];
      const particles = [];

      // 1. Viền ngoài trái tim
      const borderCount = 130;
      for (let i = 0; i < borderCount; i++) {
        const t = (Math.PI * 2 * i) / borderCount;
        const pos = heartCurve(t);
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

        particles.push({
          targetRelX: pos.x,
          targetRelY: pos.y,
          currX: width / 2 + Math.cos(angle) * dist,
          currY: height / 2 + Math.sin(angle) * dist,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          size: Math.random() * 3 + 14,
          progress: 0,
          speed: 0.012 + Math.random() * 0.01,
          delay: Math.random() * 45,
          phase: Math.random() * Math.PI * 2
        });
      }

      // 2. Ruột trong trái tim
      const insideCount = 280;
      let added = 0;
      while (added < insideCount) {
        const rx = (Math.random() * 2 - 1) * 15.5;
        const ry = Math.random() * 28 - 16;

        if (isInsideHeart(rx, ry)) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

          particles.push({
            targetRelX: rx,
            targetRelY: ry,
            currX: width / 2 + Math.cos(angle) * dist,
            currY: height / 2 + Math.sin(angle) * dist,
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            size: Math.random() * 4 + 11,
            progress: 0,
            speed: 0.01 + Math.random() * 0.012,
            delay: Math.random() * 55,
            phase: Math.random() * Math.PI * 2
          });
          added++;
        }
      }

      // 3. Các hạt sao lơ lửng xung quanh không gian nền
      const ambientStars = [];
      for (let i = 0; i < 45; i++) {
        ambientStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2.2 + 0.8,
          alpha: Math.random() * 0.7 + 0.2,
          phase: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.045;
        frame++;

        // Vẽ sao bụi lấp lánh nền
        for (let i = 0; i < ambientStars.length; i++) {
          const star = ambientStars[i];
          const curAlpha = star.alpha + Math.sin(time * 1.5 + star.phase) * 0.25;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 180, 200, ${Math.max(0.1, curAlpha)})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#ff4d6d';
          ctx.fill();
        }

        const beat = 1 + 0.08 * Math.pow(Math.sin(time), 8) + 0.03 * Math.sin(time * 2);
        const scale = (Math.min(width, height) / 38) * beat;
        const centerX = width / 2;
        const centerY = height / 2 - 45;

        // Vùng hào quang hồng rộng lớn lan tỏa không gian
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 190 * beat);
        gradient.addColorStop(0, 'rgba(255, 42, 109, 0.38)');
        gradient.addColorStop(0.5, 'rgba(255, 77, 109, 0.15)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 200 * beat, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const floatOffset = (p.progress >= 1) ? Math.sin(time * 2 + p.phase) * 1.8 : 0;

          const targetX = centerX + p.targetRelX * scale + floatOffset;
          const targetY = centerY + p.targetRelY * scale + floatOffset;

          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          const currentSize = p.size * (0.6 + 0.4 * ease) + (p.progress >= 1 ? Math.sin(time * 2 + p.phase) * 0.8 : 0);

          ctx.font = `${currentSize}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.globalAlpha = Math.min(1, ease + 0.2);
          ctx.fillText(p.emoji, drawX, drawY);
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #050208;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Phong bì mở đầu */
    #envelope-wrapper {
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .envelope {
      position: relative;
      width: 200px;
      height: 140px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.4);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .heart-seal {
      font-size: 42px;
    }

    .hint-text {
      margin-top: 22px;
      color: #ffb3c1;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    }

    /* Thiệp tâm sự */
    #letter-card {
      position: absolute;
      width: 86%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 26px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 77, 109, 0.3);
      text-align: center;
      z-index: 60;
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #letter-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .letter-title {
      font-size: 1.2rem;
      color: #c9184a;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .letter-content {
      color: #444;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: justify;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(201, 24, 74, 0.4);
    }

    /* Khung hiển thị Trái Tim Canvas */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Các dòng chữ đa ngôn ngữ chạy phía dưới trái tim */
    #lang-text {
      position: absolute;
      bottom: 12%;
      width: 100%;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff0055;
      letter-spacing: 1px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #sub-text {
      position: absolute;
      bottom: 7.5%;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffb3c1;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* Tia tim mini khi chạm ngón tay */
    .touch-heart {
      position: fixed;
      pointer-events: none;
      user-select: none;
      font-size: 16px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>

  <!-- Bước 1: Bì thư -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="heart-seal">💌</div>
    </div>
    <div class="hint-text">Gửi Bảo Bei, tình cảm của bé💕</div>
  </div>

  <!-- Bước 2: Thiệp tâm tình -->
  <div id="letter-card">
    <div class="letter-title">Gửi Bảo Bei của bé 💕</div>
    <div class="letter-content">
      Bé iuu Bảo Bei Nhất 💕
    </div>
    <button class="surprise-btn" onclick="startHeartShow()">Xem điều bất ngờ 💖</button>
  </div>

  <!-- Bước 3: Trái tim phát sáng & chữ chạy -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
    <div id="lang-text">Anh yêu Bảo Bei 💕</div>
    <div id="sub-text">Forever with Bảo Bei ✨</div>
  </div>

  <script>
    const phrases = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei",
      "我爱你, Bảo Bei",
      "사랑해, Bảo Bei",
      "愛してる, Bảo Bei",
      "Je t'aime, Bảo Bei",
      "Te amo, Bảo Bei",
      "Ich liebe dich, Bảo Bei",
      "Ti amo, Bảo Bei",
      "Я люблю тебя, Bảo Bei",
      "ฉันรักเธอ, Bảo Bei",
      "Em yêu Bảo Bei 💕"
    ];

    // Tạo tia tim khi chạm/lướt màn hình
    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.2) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💖' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    function openEnvelope() {
      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      const env = document.getElementById('envelope-wrapper');
      env.style.opacity = '0';
      env.style.transform = 'scale(0.7)';

      setTimeout(() => {
        env.style.display = 'none';
        const card = document.getElementById('letter-card');
        card.style.display = 'block';
        setTimeout(() => card.classList.add('show'), 20);
      }, 700);
    }

    function startHeartShow() {
      const card = document.getElementById('letter-card');
      card.classList.remove('show');

      setTimeout(() => {
        card.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initHeartCanvas();
        startTextRotation();
      }, 500);
    }

    function startTextRotation() {
      let idx = 0;
      const textEl = document.getElementById('lang-text');
      setInterval(() => {
        textEl.style.opacity = '0';
        setTimeout(() => {
          idx = (idx + 1) % phrases.length;
          textEl.innerText = phrases[idx];
          textEl.style.opacity = '1';
        }, 400);
      }, 2400);
    }

    /* Hiệu ứng Trái tim Canvas đập nhịp */
    function initHeartCanvas() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Công thức tạo hình trái tim chuẩn xác
      function heartPosition(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const points = [];
      const totalPoints = 380;
      for (let i = 0; i < totalPoints; i++) {
        const t = (Math.PI * 2 * i) / totalPoints;
        const pos = heartPosition(t);
        points.push({
          x: pos.x,
          y: pos.y,
          r: Math.random() * 2 + 1,
          alpha: Math.random() * 0.7 + 0.3
        });
      }

      let beatProgress = 0;

      function render() {
        ctx.fillStyle = 'rgba(5, 2, 8, 0.25)';
        ctx.fillRect(0, 0, width, height);

        beatProgress += 0.04;
        // Nhịp đập tim
        const beatScale = 1 + 0.15 * Math.pow(Math.sin(beatProgress), 6);
        const scale = Math.min(width, height) / 38 * beatScale;

        const centerX = width / 2;
        const centerY = height / 2 - 40; // Nâng nhẹ lên trên nhường chỗ cho dòng chữ

        // Vẽ từng điểm hạt phát sáng
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const px = centerX + p.x * scale + (Math.random() - 0.5) * 4;
          const py = centerY + p.y * scale + (Math.random() - 0.5) * 4;

          ctx.beginPath();
          ctx.arc(px, py, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 77, 109, ${p.alpha})`;
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#ff2a55';
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

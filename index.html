<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #260216 0%, #050107 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Đom đóm nền giai đoạn 1 */
    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    /* Nút Bật/Tắt Nhạc */
    #music-control {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 77, 109, 0.2);
      border: 1px solid rgba(255, 117, 140, 0.4);
      color: #ffccd5;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 200;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    /* Khung Phong bì */
    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    /* Tờ thư */
    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    /* Khung Canvas */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <button id="music-control" onclick="toggleMusic(event)" title="Bật/Tắt nhạc">🎵</button>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Lá thư -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Canvas Trái tim 3D -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 40; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 4 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -45px) scale(0.2)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      if (music.paused) {
        music.play().then(() => {
          musicBtn.innerText = '🎵';
          musicBtn.style.opacity = '1';
        }).catch(() => {});
      } else {
        music.pause();
        musicBtn.innerText = '🔇';
        musicBtn.style.opacity = '0.6';
      }
    }

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      music.play().then(() => {
        musicBtn.innerText = '🎵';
      }).catch(() => {
        musicBtn.innerText = '🔇';
      });

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
      }, 1100);
    }

    function startHeartShow(e) {
      e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      fireflyContainer.style.display = 'none';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initCrispHeart();
      }, 850);
    }

    function initCrispHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      // 1. Sao nền lấp lánh
      const stars = [];
      for (let i = 0; i < 180; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.5 + 0.4,
          twinkleSpeed: 0.02 + Math.random() * 0.04,
          phase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.4 ? '#ffffff' : '#ffd1dc'
        });
      }

      // 2. Bụi tiên bay lơ lửng
      const stardust = [];
      for (let i = 0; i < 60; i++) {
        stardust.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -(Math.random() * 0.5 + 0.2),
          size: Math.random() * 2 + 0.8,
          alpha: Math.random() * 0.5 + 0.2,
          pulse: Math.random() * Math.PI * 2
        });
      }

      // 3. Sao băng
      const shootingStars = [];
      function spawnShootingStar() {
        shootingStars.push({
          x: Math.random() * width * 0.8 + width * 0.1,
          y: Math.random() * (height * 0.35),
          len: Math.random() * 90 + 40,
          speed: Math.random() * 6 + 7,
          angle: (Math.PI / 4) + (Math.random() - 0.5) * 0.2,
          opacity: 1
        });
      }

      // 4. Sóng xung kích trái tim
      const shockwaves = [];

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        for (let s of stars) {
          s.x = Math.random() * width;
          s.y = Math.random() * height;
        }
      });

      // Phương trình toán học trái tim 3D thể tích
      function heartFunction(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      /* TẠO KHỐI HẠT TRÁI TIM TỰ NHIÊN (ORGANIC 3D HEART) */
      const heartParticles = [];
      const totalHeartParticles = 1400; // Mật độ hạt dày dặn, mịn như dải ngân hà

      for (let i = 0; i < totalHeartParticles; i++) {
        const t = Math.PI * 2 * Math.random();
        const base = heartFunction(t);

        // Phân phối thể tích ngẫu nhiên theo bán kính để không bị chia thành từng vệt vòng tròn lộ liễu
        const r = Math.pow(Math.random(), 0.55); // rải đều từ tâm ra viền
        // Độ dày trục Z tạo hình phồng 3D quả tim
        const zThickness = (1 - r) * (Math.random() - 0.5) * 16;

        // Jitter nhẹ vị trí để phá bỏ tính cơ học của công thức
        const jitter = (Math.random() - 0.5) * 0.5;
        const hx = base.x * r + jitter;
        const hy = (base.y - (-2.5)) * r + (-2.5) + jitter;
        const hz = zThickness;

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

        // Màu sắc chuyển dần từ viền hồng neon vào lõi trắng hồng
        const isCore = r < 0.35 && Math.random() > 0.4;
        const color = isCore ? '#ffffff' : (r > 0.85 ? '#ff1e56' : (Math.random() > 0.5 ? '#ff4d6d' : '#ff758c'));

        heartParticles.push({
          x3d: hx,
          y3d: hy,
          z3d: hz,
          currX: width / 2 + Math.cos(angle) * dist,
          currY: height / 2 + Math.sin(angle) * dist,
          size: isCore ? (Math.random() * 1.8 + 1.2) : (Math.random() * 1.4 + 0.8),
          color: color,
          alpha: Math.random() * 0.4 + 0.6,
          progress: 0,
          speed: 0.0035 + Math.random() * 0.003,
          delay: Math.random() * 80,
          phase: Math.random() * Math.PI * 2
        });
      }

      // Đĩa hạt xoay chân đế
      const ringParticles = [];
      const ringCount = 180;
      for (let i = 0; i < ringCount; i++) {
        ringParticles.push({
          theta: Math.random() * Math.PI * 2,
          radius: Math.random() * 110 + 60,
          speed: 0.01 + Math.random() * 0.006,
          size: Math.random() * 1.6 + 0.5,
          alpha: Math.random() * 0.6 + 0.3
        });
      }

      let time = 0;
      let frame = 0;
      let lastBeatPeak = false;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.032;
        frame++;

        const centerX = width / 2;
        const centerY = height * 0.35;
        const ringCenterY = height * 0.76;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusY = ringRadiusX * 0.34;

        if (Math.random() < 0.008) spawnShootingStar();

        // ================= BACKGROUND =================
        const nebula = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, Math.max(width, height) * 0.65);
        nebula.addColorStop(0, 'rgba(120, 10, 50, 0.32)');
        nebula.addColorStop(0.45, 'rgba(40, 5, 25, 0.18)');
        nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, width, height);

        // Bầu trời sao
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = (Math.sin(time * 30 * s.twinkleSpeed + s.phase) + 1) / 2;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * (0.8 + 0.4 * twinkle), 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = 0.2 + 0.75 * twinkle;
          ctx.fill();
        }

        // Sao băng
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const ss = shootingStars[i];
          ss.x += Math.cos(ss.angle) * ss.speed;
          ss.y += Math.sin(ss.angle) * ss.speed;
          ss.opacity -= 0.015;

          if (ss.opacity <= 0) {
            shootingStars.splice(i, 1);
            continue;
          }

          const tailX = ss.x - Math.cos(ss.angle) * ss.len;
          const tailY = ss.y - Math.sin(ss.angle) * ss.len;
          const gradSS = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
          gradSS.addColorStop(0, 'rgba(255, 117, 140, 0)');
          gradSS.addColorStop(1, `rgba(255, 255, 255, ${ss.opacity})`);

          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(ss.x, ss.y);
          ctx.strokeStyle = gradSS;
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        // Bụi tiên
        for (let i = 0; i < stardust.length; i++) {
          const dust = stardust[i];
          dust.x += dust.vx;
          dust.y += dust.vy;
          dust.pulse += 0.03;

          if (dust.y < -10) { dust.y = height + 10; dust.x = Math.random() * width; }
          if (dust.x < -10) dust.x = width + 10;
          if (dust.x > width + 10) dust.x = -10;

          const dAlpha = ((Math.sin(dust.pulse) + 1) / 2) * dust.alpha;
          ctx.beginPath();
          ctx.arc(dust.x, dust.y, dust.size, 0, Math.PI * 2);
          ctx.fillStyle = '#ff85a1';
          ctx.shadowBlur = 5;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = dAlpha;
          ctx.fill();
        }

        // ================= NHỊP TIM & SHOCKWAVE =================
        const beatPower = Math.pow(Math.sin(time * 1.3), 8);
        const beat = 1 + 0.09 * beatPower + 0.02 * Math.sin(time * 2.6);
        const scale = (Math.min(width, height) / 37) * beat;

        if (beatPower > 0.82 && !lastBeatPeak) {
          shockwaves.push({ radius: 25, maxRadius: 210, opacity: 0.65 });
          lastBeatPeak = true;
        } else if (beatPower <= 0.82) {
          lastBeatPeak = false;
        }

        // Vẽ shockwave
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.radius += 3.2;
          sw.opacity -= 0.012;

          if (sw.opacity <= 0 || sw.radius >= sw.maxRadius) {
            shockwaves.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, centerY, sw.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255, 77, 109, ${sw.opacity})`;
          ctx.lineWidth = 1.8;
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff2a6d';
          ctx.stroke();
          ctx.restore();
        }

        // Hào quang tâm tim
        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 150 * beat);
        grad.addColorStop(0, 'rgba(255, 42, 109, 0.45)');
        grad.addColorStop(0.5, 'rgba(255, 77, 109, 0.12)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 160 * beat, 0, Math.PI * 2);
        ctx.fill();

        // ================= HIỆU ỨNG TRÁI TIM 3D BỤI SAO =================
        // Bật chế độ trộn màu 'lighter' giúp các hạt đè lên nhau sẽ tự phát sáng rực rỡ
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        // Góc xoay 3D nhẹ quanh trục Y & Z tạo cảm giác sống động
        const rotY = Math.sin(time * 0.5) * 0.22;
        const rotX = Math.cos(time * 0.4) * 0.08;

        for (let i = 0; i < heartParticles.length; i++) {
          const p = heartParticles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          // Xoay tọa độ 3D quanh trục Y
          const x1 = p.x3d * Math.cos(rotY) + p.z3d * Math.sin(rotY);
          const z1 = -p.x3d * Math.sin(rotY) + p.z3d * Math.cos(rotY);

          // Xoay nhẹ quanh trục X
          const y2 = p.y3d * Math.cos(rotX) - z1 * Math.sin(rotX);
          const z2 = p.y3d * Math.sin(rotX) + z1 * Math.cos(rotX);

          // Phép chiếu phối cảnh Perspective
          const fov = 350;
          const persp = fov / (fov + z2 * scale * 0.3);

          const floatOffset = (p.progress >= 1) ? Math.sin(time * 2.2 + p.phase) * 0.8 : 0;
          const targetX = centerX + x1 * scale * persp + floatOffset;
          const targetY = centerY + y2 * scale * persp + floatOffset;

          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          ctx.beginPath();
          ctx.arc(drawX, drawY, p.size * persp * (0.5 + 0.5 * ease), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = p.alpha * ease * Math.min(1, Math.max(0.4, persp));
          ctx.fill();
        }
        ctx.restore();

        // ================= VÒNG HẠT XOAY CHÂN ĐẾ =================
        for (let i = 0; i < ringParticles.length; i++) {
          const rp = ringParticles[i];
          rp.theta += rp.speed;

          const rx = centerX + Math.cos(rp.theta) * (rp.radius * (ringRadiusX / 140));
          const ry = ringCenterY + Math.sin(rp.theta) * (rp.radius * (ringRadiusY / 140));
          const zDepth = (Math.sin(rp.theta) + 1) / 2;

          ctx.beginPath();
          ctx.arc(rx, ry, rp.size * (0.6 + 0.5 * zDepth), 0, Math.PI * 2);
          ctx.fillStyle = '#ff758c';
          ctx.shadowBlur = 5;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = rp.alpha * (0.3 + 0.7 * zDepth);
          ctx.fill();
        }

        // ================= VÒNG CHỮ 3D CHÂN ĐẾ =================
        const textCount = ringTexts.length;
        const sortedTexts = [];

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.4 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          const tx = centerX + cosA * ringRadiusX;
          const ty = ringCenterY + sinA * ringRadiusY;
          const zDepth = (sinA + 1) / 2;

          sortedTexts.push({
            text: ringTexts[i],
            x: tx,
            y: ty,
            z: zDepth,
            depthRatio: zDepth
          });
        }

        sortedTexts.sort((a, b) => a.z - b.z);

        for (let i = 0; i < sortedTexts.length; i++) {
          const item = sortedTexts[i];
          const fontSize = 11.5 + item.depthRatio * 6.5;

          ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.globalAlpha = 0.35 + 0.65 * item.depthRatio;
          ctx.fillStyle = item.depthRatio > 0.65 ? '#ffffff' : '#ffccd5';
          ctx.shadowBlur = item.depthRatio > 0.65 ? 14 : 6;
          ctx.shadowColor = '#ff2a6d';

          ctx.fillText(item.text, item.x, item.y);
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

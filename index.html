<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #200416 0%, #040107 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Đốm sáng đom đóm nền mở đầu */
    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 5s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px); opacity: 0.75; }
    }

    /* Khung chứa Phong bì thư */
    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.8s ease, transform 0.8s ease;
      animation: floatEnvelope 3s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    /* Nắp phong bì mở lật lên trên */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    /* Thân túi phong bì */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    /* Con dấu sáp trái tim nổi */
    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.4s infinite;
      transition: opacity 0.3s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    /* TỜ GIẤY THƯ RÚT TỪ TRONG RA (Letter Paper) */
    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3; /* Nằm trong lòng túi, sau nắp và thân trước */
      opacity: 0;
      transition: all 0.9s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    /* Trạng thái tờ thư bung ra toàn màn hình */
    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    /* Khung Canvas Trái Tim 3D */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Tờ giấy thư bên trong -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <!-- Tờ thư giấy viết tay trồi từ bên trong ra -->
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Trái tim hạt 3D và đĩa chữ xoay quanh chân đế -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 40; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 4 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 5 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    let isOpened = false;

    // Hiệu ứng: Mở nắp phong thư -> Tờ giấy thư từ từ trồi lên và mở rộng
    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      // 1. Ẩn con dấu và mở nắp phong bì lật ngược lên
      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      // 2. Tờ thư nhú lên khỏi phong bì
      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 350);

      // 3. Tờ thư bay ra giữa màn hình và bung to rõ nét
      setTimeout(() => {
        letter.classList.add('opened');
      }, 700);
    }

    // Khi bấm vào nút trong tờ giấy thư -> Tờ thư thu lại và hiện Trái tim 3D
    function startHeartShow(e) {
      e.stopPropagation(); // Ngăn chặn kích hoạt lại hàm openEnvelope

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initVolumetric3DHeart();
      }, 550);
    }

    /* Thuật toán Trái tim 3D Hạt + Đĩa Chữ Xoay Quanh Chân Đế */
    function initVolumetric3DHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function isInsideHeart(x, y) {
        const nx = x / 16;
        const ny = -y / 16;
        const a = nx * nx + ny * ny - 1;
        return (a * a * a - nx * nx * ny * ny * ny) <= 0;
      }

      // Khối hạt tim 3D
      const heartParticles = [];
      const totalHeartParticles = 1100;
      let count = 0;

      while (count < totalHeartParticles) {
        const rx = (Math.random() * 2 - 1) * 15.6;
        const ry = Math.random() * 28 - 16;
        if (isInsideHeart(rx, ry)) {
          const rz = (Math.random() * 2 - 1) * 7.5;
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

          heartParticles.push({
            origX: rx,
            origY: ry,
            origZ: rz,
            currX: width / 2 + Math.cos(angle) * dist,
            currY: height / 2 + Math.sin(angle) * dist,
            size: Math.random() * 2.2 + 0.8,
            color: Math.random() > 0.4 ? '#ff2a6d' : (Math.random() > 0.5 ? '#ff5c8a' : '#ffa8be'),
            alpha: Math.random() * 0.7 + 0.3,
            progress: 0,
            speed: 0.007 + Math.random() * 0.006,
            delay: Math.random() * 70,
            phase: Math.random() * Math.PI * 2
          });
          count++;
        }
      }

      // Đĩa hạt xoay
      const ringParticles = [];
      const ringCount = 220;
      for (let i = 0; i < ringCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const radius = Math.random() * 110 + 60;
        ringParticles.push({
          theta: theta,
          radius: radius,
          speed: 0.012 + Math.random() * 0.008,
          size: Math.random() * 1.8 + 0.6,
          alpha: Math.random() * 0.6 + 0.3
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.04;
        frame++;

        const centerX = width / 2;
        const centerY = height * 0.38;
        const ringCenterY = height * 0.75;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusY = ringRadiusX * 0.35;

        const beat = 1 + 0.09 * Math.pow(Math.sin(time * 1.1), 8);
        const scale = (Math.min(width, height) / 38) * beat;

        // Vầng sáng trung tâm
        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 160 * beat);
        grad.addColorStop(0, 'rgba(255, 42, 109, 0.4)');
        grad.addColorStop(0.6, 'rgba(255, 77, 109, 0.1)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 170 * beat, 0, Math.PI * 2);
        ctx.fill();

        // 1. Vẽ các hạt tim 3D
        for (let i = 0; i < heartParticles.length; i++) {
          const p = heartParticles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const rotAngle = Math.sin(time * 0.6) * 0.15;
          const cosRot = Math.cos(rotAngle);
          const sinRot = Math.sin(rotAngle);

          const rotX = p.origX * cosRot + p.origZ * sinRot;
          const rotZ = -p.origX * sinRot + p.origZ * cosRot;

          const fov = 35;
          const pScale = fov / (fov + rotZ);

          const floatOffset = (p.progress >= 1) ? Math.sin(time * 2 + p.phase) * 1.5 : 0;
          const targetX = centerX + rotX * scale * pScale + floatOffset;
          const targetY = centerY + p.origY * scale * pScale + floatOffset;

          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          ctx.beginPath();
          ctx.arc(drawX, drawY, p.size * pScale * (0.4 + 0.6 * ease), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = p.alpha * ease;
          ctx.fill();
        }

        // 2. Vẽ các hạt đĩa xoay chân đế
        for (let i = 0; i < ringParticles.length; i++) {
          const rp = ringParticles[i];
          rp.theta += rp.speed;

          const rx = centerX + Math.cos(rp.theta) * (rp.radius * (ringRadiusX / 140));
          const ry = ringCenterY + Math.sin(rp.theta) * (rp.radius * (ringRadiusY / 140));
          const zDepth = (Math.sin(rp.theta) + 1) / 2;

          ctx.beginPath();
          ctx.arc(rx, ry, rp.size * (0.6 + 0.5 * zDepth), 0, Math.PI * 2);
          ctx.fillStyle = '#ff758c';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#ff2a6d';
          ctx.globalAlpha = rp.alpha * (0.3 + 0.7 * zDepth);
          ctx.fill();
        }

        // 3. Vẽ chữ 3D xoay quanh đĩa
        const textCount = ringTexts.length;
        const sortedTexts = [];

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.45 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          const tx = centerX + cosA * ringRadiusX;
          const ty = ringCenterY + sinA * ringRadiusY;
          const zDepth = (sinA + 1) / 2; 

          sortedTexts.push({
            text: ringTexts[i],
            x: tx,
            y: ty,
            z: zDepth,
            depthRatio: zDepth
          });
        }

        sortedTexts.sort((a, b) => a.z - b.z);

        for (let i = 0; i < sortedTexts.length; i++) {
          const item = sortedTexts[i];
          const fontSize = 11 + item.depthRatio * 6.5;

          ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.globalAlpha = 0.35 + 0.65 * item.depthRatio;
          ctx.fillStyle = item.depthRatio > 0.65 ? '#ffffff' : '#ffccd5';
          ctx.shadowBlur = item.depthRatio > 0.65 ? 14 : 6;
          ctx.shadowColor = '#ff2a6d';

          ctx.fillText(item.text, item.x, item.y);
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at center, #1a0515 0%, #030106 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Phong bì mở đầu */
    #envelope-wrapper {
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .envelope {
      position: relative;
      width: 200px;
      height: 140px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(255, 77, 109, 0.45);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .heart-seal {
      font-size: 42px;
    }

    .hint-text {
      margin-top: 22px;
      color: #ffb3c1;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    }

    /* Thiệp tâm tình */
    #letter-card {
      position: absolute;
      width: 86%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 77, 109, 0.35);
      text-align: center;
      z-index: 60;
      display: none;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #letter-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .letter-title {
      font-size: 1.25rem;
      color: #c9184a;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .letter-content {
      color: #333;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 22px;
      font-weight: 500;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(201, 24, 74, 0.45);
    }

    /* Khu vực hiển thị Trái Tim Emoji */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Chữ chạy phía dưới */
    .caption-container {
      position: absolute;
      bottom: 8%;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    #lang-text {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 12px #ff4d6d, 0 0 25px #ff0055;
      letter-spacing: 0.8px;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: scale(1);
    }

    #sub-text {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #ffb3c1;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 16px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>

  <!-- Bước 1: Phong bì -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="heart-seal">💌</div>
    </div>
    <div class="hint-text">Gửi Bảo Bei, tình cảm của bé💕</div>
  </div>

  <!-- Bước 2: Thiệp -->
  <div id="letter-card">
    <div class="letter-title">Gửi Bảo Bei của bé 💕</div>
    <div class="letter-content">
      Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm nút dưới bấm nút dưới...
    </div>
    <button class="surprise-btn" onclick="startHeartShow()">Xem điều bất ngờ 💖</button>
  </div>

  <!-- Bước 3: Trái tim tạo từ emoji 💗 ❤️ 💕 -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
    <div class="caption-container">
      <div id="lang-text">Anh yêu Bảo Bei 💕</div>
      <div id="sub-text">Forever with Bảo Bei ✨</div>
    </div>
  </div>

  <script>
    const phrases = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei",
      "愛してる, Bảo Bei",
      "Je t'aime, Bảo Bei",
      "Te amo, Bảo Bei 💕",
      "Ich liebe dich, Bảo Bei",
      "Ti amo, Bảo Bei",
      "Я люблю тебя, Bảo Bei",
      "ฉันรักเธอ, Bảo Bei",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    // Chạm tạo hiệu ứng phụ
    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '💕';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    function openEnvelope() {
      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      const env = document.getElementById('envelope-wrapper');
      env.style.opacity = '0';
      env.style.transform = 'scale(0.7)';

      setTimeout(() => {
        env.style.display = 'none';
        const card = document.getElementById('letter-card');
        card.style.display = 'block';
        setTimeout(() => card.classList.add('show'), 20);
      }, 700);
    }

    function startHeartShow() {
      const card = document.getElementById('letter-card');
      card.classList.remove('show');

      setTimeout(() => {
        card.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initEmojiHeart();
        startTextRotation();
      }, 500);
    }

    function startTextRotation() {
      let idx = 0;
      const textEl = document.getElementById('lang-text');
      setInterval(() => {
        textEl.style.opacity = '0';
        textEl.style.transform = 'scale(0.85)';
        setTimeout(() => {
          idx = (idx + 1) % phrases.length;
          textEl.innerText = phrases[idx];
          textEl.style.opacity = '1';
          textEl.style.transform = 'scale(1)';
        }, 400);
      }, 2600);
    }

    /* Hiệu ứng Emoji 💗❤️💕 bay từ từ hình thành trái tim */
    function initEmojiHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function heartFormula(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const emojis = ['💗', '❤️', '💕', '💖'];
      const particles = [];
      const totalCount = 360; // Số lượng emoji tạo hình trái tim

      for (let i = 0; i < totalCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const base = heartFormula(t);
        const r = Math.pow(Math.random(), 0.5); // Phủ đều từ trong ra ngoài

        // Vị trí xuất phát ngẫu nhiên bay từ 4 phía ngoài màn hình
        const angle = Math.random() * Math.PI * 2;
        const spawnDist = Math.max(width, height) * (0.8 + Math.random() * 0.4);

        particles.push({
          targetRelX: base.x * r,
          targetRelY: base.y * r,
          currX: width / 2 + Math.cos(angle) * spawnDist,
          currY: height / 2 + Math.sin(angle) * spawnDist,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          size: Math.random() * 6 + 13, // Kích thước emoji
          progress: 0,
          speed: 0.008 + Math.random() * 0.012, // Tốc độ bay tụ lại
          delay: Math.random() * 60 // Bay lệch pha để tạo độ tự nhiên
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.05;
        frame++;

        // Nhịp tim đập sau khi đã dần tụ lại
        const beat = 1 + 0.08 * Math.pow(Math.sin(time), 8);
        const scale = (Math.min(width, height) / 38) * beat;
        const centerX = width / 2;
        const centerY = height / 2 - 45;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (frame > p.delay) {
            if (p.progress < 1) {
              p.progress += p.speed;
              if (p.progress > 1) p.progress = 1;
            }
          }

          // Tọa độ mục tiêu trong nhịp đập tim
          const targetX = centerX + p.targetRelX * scale;
          const targetY = centerY + p.targetRelY * scale;

          // Hiệu ứng bay mượt (Ease Out)
          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          ctx.font = `${p.size}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.globalAlpha = Math.min(1, ease + 0.15);
          ctx.fillText(p.emoji, drawX, drawY);
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #240215 0%, #040106 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    #music-control {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 77, 109, 0.2);
      border: 1px solid rgba(255, 117, 140, 0.4);
      color: #ffccd5;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 200;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <button id="music-control" onclick="toggleMusic(event)" title="Bật/Tắt nhạc">🎵</button>
  <div id="fireflies"></div>

  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "我爱你, Bảo Bei 💕",
      "사랑해, Bảo Bei ✨",
      "愛してる, Bảo Bei 💕",
      "Je t'aime, Bảo Bei ✨",
      "Te amo, Bảo Bei 💕",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 25; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 3 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.2) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -35px) scale(0.2)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 600);
      }
    });

    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-control');

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      if (music.paused) {
        music.play().then(() => {
          musicBtn.innerText = '🎵';
          musicBtn.style.opacity = '1';
        }).catch(() => {});
      } else {
        music.pause();
        musicBtn.innerText = '🔇';
        musicBtn.style.opacity = '0.6';
      }
    }

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      music.play().then(() => {
        musicBtn.innerText = '🎵';
      }).catch(() => {
        musicBtn.innerText = '🔇';
      });

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
      }, 1100);
    }

    function startHeartShow(e) {
      e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      fireflyContainer.style.display = 'none';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initCrispHeart();
      }, 850);
    }

    function initCrispHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      // ================= ĐỆM TEXTURE ĐỐM SÁNG =================
      function createGlowDot(colorInner, colorOuter) {
        const off = document.createElement('canvas');
        off.width = 16;
        off.height = 16;
        const octx = off.getContext('2d');
        const g = octx.createRadialGradient(8, 8, 1, 8, 8, 7);
        g.addColorStop(0, colorInner);
        g.addColorStop(0.5, colorOuter);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = g;
        octx.fillRect(0, 0, 16, 16);
        return off;
      }

      const texBorder = createGlowDot('#ffffff', '#ff1a53'); // Viền sáng nét
      const texInner = createGlowDot('#ffccd5', '#ff4d6d');  // Thân tim
      const texCore = createGlowDot('#ffffff', '#ff85a1');   // Lõi tim

      const stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.3 + 0.5,
          twinkleSpeed: 0.02 + Math.random() * 0.03,
          phase: Math.random() * Math.PI * 2
        });
      }

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      const heartParticles = [];
      const centerYOffset = -2.5;

      // 1. VIỀN NGOÀI: 180 hạt (giúp giữ khung tim sắc nét, liên tục)
      const borderCount = 180;
      for (let i = 0; i < borderCount; i++) {
        const t = (Math.PI * 2 * i) / borderCount;
        const pt = heartCurve(t);
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

        heartParticles.push({
          origX: pt.x,
          origY: pt.y,
          z3d: (Math.random() - 0.5) * 3,
          currX: width / 2 + Math.cos(angle) * dist,
          currY: height / 2 + Math.sin(angle) * dist,
          size: Math.random() * 1.5 + 7,
          tex: texBorder,
          alpha: 0.95,
          progress: 0,
          speed: 0.005 + Math.random() * 0.003,
          delay: Math.random() * 30
        });
      }

      // 2. RUỘT TRÁI TIM: 420 hạt chia đều cho 7 lớp (tổng cộng đúng 600 hạt)
      const layers = [
        { scale: 0.88, count: 90, offset: 0.2 },
        { scale: 0.76, count: 80, offset: 0.5 },
        { scale: 0.64, count: 70, offset: 0.8 },
        { scale: 0.52, count: 60, offset: 1.1 },
        { scale: 0.40, count: 50, offset: 1.4 },
        { scale: 0.28, count: 40, offset: 1.7 },
        { scale: 0.16, count: 30, offset: 2.0 }
      ];

      layers.forEach((layer) => {
        for (let i = 0; i < layer.count; i++) {
          const t = (Math.PI * 2 * i) / layer.count + layer.offset;
          const pt = heartCurve(t);

          const finalX = pt.x * layer.scale;
          const finalY = (pt.y - centerYOffset) * layer.scale + centerYOffset;

          const angle = Math.random() * Math.PI * 2;
          const dist = Math.max(width, height) * (0.6 + Math.random() * 0.4);

          heartParticles.push({
            origX: finalX,
            origY: finalY,
            z3d: (1 - layer.scale) * (Math.random() - 0.5) * 8,
            currX: width / 2 + Math.cos(angle) * dist,
            currY: height / 2 + Math.sin(angle) * dist,
            size: layer.scale < 0.35 ? (Math.random() * 2 + 6.5) : (Math.random() * 2 + 5.8),
            tex: layer.scale < 0.35 ? texCore : texInner,
            alpha: 0.75 + layer.scale * 0.2,
            progress: 0,
            speed: 0.005 + Math.random() * 0.003,
            delay: Math.random() * 50
          });
        }
      });

      // Đĩa hạt xoay chân đế
      const ringParticles = [];
      for (let i = 0; i < 70; i++) {
        ringParticles.push({
          theta: Math.random() * Math.PI * 2,
          radius: Math.random() * 110 + 60,
          speed: 0.01 + Math.random() * 0.005,
          size: Math.random() * 3 + 5,
          alpha: Math.random() * 0.5 + 0.3
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);

        time += 0.035;
        frame++;

        const centerX = width / 2;
        const centerY = height * 0.35;
        const ringCenterY = height * 0.76;
        const ringRadiusX = Math.min(width * 0.42, 175);
        const ringRadiusY = ringRadiusX * 0.34;

        // Quầng sáng tâm
        const beatPower = Math.pow(Math.sin(time * 1.3), 8);
        const beat = 1 + 0.08 * beatPower;
        const scale = (Math.min(width, height) / 38) * beat;

        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 150 * beat);
        grad.addColorStop(0, 'rgba(255, 42, 109, 0.38)');
        grad.addColorStop(0.5, 'rgba(255, 77, 109, 0.08)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 150 * beat, 0, Math.PI * 2);
        ctx.fill();

        // Sao nền
        ctx.fillStyle = '#ffccd5';
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const tw = (Math.sin(time * 25 * s.twinkleSpeed + s.phase) + 1) / 2;
          ctx.globalAlpha = 0.2 + 0.6 * tw;
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }

        // ================= VẼ TRÁI TIM 600 HẠT =================
        ctx.globalCompositeOperation = 'lighter';

        const rotY = Math.sin(time * 0.45) * 0.12;

        for (let i = 0; i < heartParticles.length; i++) {
          const p = heartParticles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const xRot = p.origX * Math.cos(rotY) + p.z3d * Math.sin(rotY);
          const targetX = centerX + xRot * scale;
          const targetY = centerY + p.origY * scale;

          const ease = 1 - Math.pow(1 - p.progress, 3);
          const drawX = p.currX + (targetX - p.currX) * ease;
          const drawY = p.currY + (targetY - p.currY) * ease;

          const rSize = p.size * (0.55 + 0.45 * ease);
          ctx.globalAlpha = p.alpha * ease;
          ctx.drawImage(p.tex, drawX - rSize / 2, drawY - rSize / 2, rSize, rSize);
        }

        // Đĩa hạt xoay chân đế
        for (let i = 0; i < ringParticles.length; i++) {
          const rp = ringParticles[i];
          rp.theta += rp.speed;

          const rx = centerX + Math.cos(rp.theta) * (rp.radius * (ringRadiusX / 140));
          const ry = ringCenterY + Math.sin(rp.theta) * (rp.radius * (ringRadiusY / 140));
          const zDepth = (Math.sin(rp.theta) + 1) / 2;

          const rSize = rp.size * (0.6 + 0.5 * zDepth);
          ctx.globalAlpha = rp.alpha * (0.3 + 0.7 * zDepth);
          ctx.drawImage(texInner, rx - rSize / 2, ry - rSize / 2, rSize, rSize);
        }

        ctx.globalCompositeOperation = 'source-over';

        // Đĩa chữ xoay chân đế
        const textCount = ringTexts.length;
        const sortedTexts = [];

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.4 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          sortedTexts.push({
            text: ringTexts[i],
            x: centerX + cosA * ringRadiusX,
            y: ringCenterY + sinA * ringRadiusY,
            z: (sinA + 1) / 2
          });
        }

        sortedTexts.sort((a, b) => a.z - b.z);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < sortedTexts.length; i++) {
          const item = sortedTexts[i];
          const fontSize = 11.5 + item.z * 6;

          ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.globalAlpha = 0.35 + 0.65 * item.z;
          ctx.fillStyle = item.z > 0.65 ? '#ffffff' : '#ffccd5';
          ctx.fillText(item.text, item.x, item.y);
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>

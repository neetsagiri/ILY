<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bảo Bei, tình cảm của bé💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #1a0312 0%, #080108 60%, #020004 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Đốm sáng đom đóm nền */
    .bg-firefly {
      position: absolute;
      background: #ff758c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.4;
      animation: floatFirefly 6s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatFirefly {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.75; }
    }

    /* Khung Phong bì */
    #envelope-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      z-index: 50;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: floatEnvelope 3.5s ease-in-out infinite;
    }

    @keyframes floatEnvelope {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 170px;
      background: #9b0e31;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 45px rgba(255, 42, 109, 0.45), 0 0 35px rgba(255, 117, 140, 0.25);
      margin: 0 auto;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 105px solid #cb1a40;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 130px solid #b31439;
      border-right: 130px solid #b31439;
      border-bottom: 98px solid #d91c47;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #ffccd5 0%, #ff4d6d 70%, #900523 100%);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 6;
      animation: pulse 1.6s infinite;
      transition: opacity 0.5s ease;
    }

    .hint-text {
      margin-top: 26px;
      color: #ffccd5;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      user-select: none;
    }

    .tap-hint {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ff85a1;
      opacity: 0.85;
      letter-spacing: 1px;
      user-select: none;
    }

    /* Lá thư trồi lên */
    #paper-letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 230px;
      height: 145px;
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 26px, #f1e4d8 27px);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 14px;
      z-index: 3;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.2, 0.8, 0.25, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ebd9c8;
    }

    #paper-letter.opened {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 88%;
      max-width: 360px;
      height: auto;
      min-height: 250px;
      padding: 26px 22px;
      border-radius: 18px;
      z-index: 100;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 77, 109, 0.4);
      background: #fffdf7;
      background-image: repeating-linear-gradient(#fffdf7, #fffdf7 27px, #faeade 28px);
    }

    .paper-header {
      font-size: 1.22rem;
      color: #c9184a;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .paper-body {
      color: #3b2826;
      font-size: 1.02rem;
      line-height: 1.68;
      font-weight: 500;
      text-align: center;
      margin-bottom: 22px;
    }

    .paper-stamp {
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .surprise-btn {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(201, 24, 74, 0.45);
      align-self: center;
    }

    /* Khung Canvas Trái tim 3D */
    #heart-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 10;
      cursor: grab;
      user-select: none;
    }

    #heart-wrapper:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-heart {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      z-index: 999;
      transition: transform 0.7s ease-out, opacity 0.7s ease-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="audio.mp3" preload="auto" loop></audio>
  <div id="fireflies"></div>

  <!-- Bước 1: Phong bì và Lá thư -->
  <div id="envelope-wrapper" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-flap" id="envFlap"></div>
      
      <div id="paper-letter">
        <div class="paper-stamp">💌</div>
        <div class="paper-header">Gửi Bảo Bei của bé 💕</div>
        <div class="paper-body">
          Bé iuu Bảo Bei Nhất 💕, Bảo Bei bấm ở dưới bấm ở dưới...
        </div>
        <button class="surprise-btn" onclick="startHeartShow(event)">Xem điều bất ngờ 💖</button>
      </div>

      <div class="envelope-pocket"></div>
      <div class="heart-seal" id="heartSeal">❤️</div>
    </div>
    
    <div class="hint-text" id="hintTitle">Gửi Bảo Bei, tình cảm của bé 💕</div>
    <span class="tap-hint" id="hintSub">(Chạm vào phong thư để mở ✨)</span>
  </div>

  <!-- Bước 2: Canvas Trái tim 3D ngập tràn hạt phát sáng -->
  <div id="heart-wrapper">
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    const ringTexts = [
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "Bé iuu Bảo Bei Nhất 💕",
      "Anh yêu Bảo Bei 💕",
      "I Love You, Bảo Bei ✨",
      "Bé iuu Bảo Bei Nhất 💕"
    ];

    // Đom đóm nền
    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 40; i++) {
      const fly = document.createElement('div');
      fly.className = 'bg-firefly';
      const size = Math.random() * 4 + 2;
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = Math.random() * 100 + 'vw';
      fly.style.top = Math.random() * 100 + 'vh';
      fly.style.animationDelay = Math.random() * 6 + 's';
      fireflyContainer.appendChild(fly);
    }

    // Hiệu ứng chạm / rê chuột bay tim lấp lánh
    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.25) {
        const heart = document.createElement('div');
        heart.className = 'touch-heart';
        heart.innerText = Math.random() > 0.5 ? '💗' : '✨';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0.3)`;
          heart.style.opacity = '0';
        }, 20);

        setTimeout(() => heart.remove(), 700);
      }
    });

    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const music = document.getElementById('bg-music');
      music.play().catch(() => {});

      document.getElementById('heartSeal').style.opacity = '0';
      document.getElementById('envFlap').style.transform = 'rotateX(180deg)';
      document.getElementById('hintTitle').style.opacity = '0';
      document.getElementById('hintSub').style.opacity = '0';

      const letter = document.getElementById('paper-letter');

      setTimeout(() => {
        letter.style.opacity = '1';
        letter.style.transform = 'translateX(-50%) translateY(-65px) scale(0.9)';
      }, 500);

      setTimeout(() => {
        letter.classList.add('opened');
      }, 1100);
    }

    function startHeartShow(e) {
      e.stopPropagation();

      const letter = document.getElementById('paper-letter');
      const envWrapper = document.getElementById('envelope-wrapper');

      letter.style.transition = 'all 0.9s ease';
      letter.style.opacity = '0';
      letter.style.transform = 'translate(-50%, -50%) scale(0.7)';
      envWrapper.style.opacity = '0';
      envWrapper.style.transform = 'scale(0.7)';

      setTimeout(() => {
        envWrapper.style.display = 'none';
        const hw = document.getElementById('heart-wrapper');
        hw.style.display = 'block';
        setTimeout(() => hw.style.opacity = '1', 50);
        initDense3DHeart();
      }, 850);
    }

    /* Thuật toán tạo trái tim 3D phủ kín đặc bằng hàng ngàn hạt phát sáng */
    function initDense3DHeart() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Góc xoay 3D (có thể vuốt/kéo xoay tự do)
      let rotX = 0.12;
      let rotY = 0;
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;

      const hw = document.getElementById('heart-wrapper');
      hw.addEventListener('pointerdown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });

      // Đường cong trái tim chuẩn tham số
      function heartCurve(t) {
        return {
          x: 16 * Math.pow(Math.sin(t), 3),
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      // Khởi tạo các hạt 3D phủ đầy toàn bộ thể tích trái tim
      const particles = [];
      const TOTAL_PARTICLES = 3600; // Mật độ dày đặc phủ kín trái tim

      const colorPalette = [
        '#ffffff', // Điểm sáng lấp lánh (sparkle)
        '#ffe4e9', // Hồng sáng
        '#ff7597', // Hồng cánh sen
        '#ff2a6d', // Đỏ hồng rực
        '#c9184a', // Đỏ nhung
        '#9b0e31'  // Đỏ trầm chiều sâu
      ];

      for (let i = 0; i < TOTAL_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const curve = heartCurve(t);

        // Phân bổ từ trong lõi ra ngoài vỏ
        const isCore = Math.random() < 0.65;
        const layer = isCore ? Math.pow(Math.random(), 0.5) : (0.85 + Math.random() * 0.15);

        const x2D = curve.x * layer;
        const y2D = curve.y * layer;

        // Chiều sâu Z: phần trên nở phồng tròn, thon nhỏ dần về đáy nhọn
        const depthFactor = Math.max(0.08, (curve.y + 17) / 33);
        const maxZ = 9.5 * depthFactor * Math.sqrt(Math.max(0, 1 - Math.pow(layer - 0.5, 2)));
        const z3D = (Math.random() * 2 - 1) * maxZ * (isCore ? Math.random() : 1);

        // Vị trí xuất phát ngẫu nhiên ngoài không gian để bay tụ lại
        const scatterAngle = Math.random() * Math.PI * 2;
        const scatterDist = Math.max(width, height) * (0.6 + Math.random() * 0.5);

        // Chọn màu theo độ sâu hoặc ngẫu nhiên điểm sáng
        let color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        if (Math.random() < 0.12) color = '#ffffff';

        particles.push({
          origX: x2D,
          origY: y2D + 2.0, // Căn tâm trục Y
          origZ: z3D,
          currX: width / 2 + Math.cos(scatterAngle) * scatterDist,
          currY: height / 2 + Math.sin(scatterAngle) * scatterDist,
          currZ: (Math.random() - 0.5) * 400,
          size: Math.random() * 1.5 + 1.0,
          color: color,
          progress: 0,
          speed: 0.0035 + Math.random() * 0.0035,
          delay: Math.random() * 80,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }

      // Trái tim nhỏ bay phụ bên cạnh (giống hình mẫu)
      const miniHeartParticles = [];
      for (let i = 0; i < 280; i++) {
        const t = Math.random() * Math.PI * 2;
        const c = heartCurve(t);
        const s = 0.35 + Math.random() * 0.1;
        miniHeartParticles.push({
          x: c.x * s + 18,
          y: c.y * s - 8,
          z: (Math.random() - 0.5) * 5,
          color: Math.random() > 0.4 ? '#ff7597' : '#ffccd5',
          size: Math.random() * 1.3 + 0.8,
          phase: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      let frame = 0;

      function render() {
        ctx.clearRect(0, 0, width, height);
        time += 0.03;
        frame++;

        if (!isDragging) {
          rotY += 0.007; // Tự động xoay quanh trục Y nhẹ nhàng
        }

        const centerX = width / 2;
        const centerY = height * 0.45;

        // Nhịp đập phập phồng (Heartbeat)
        const beat = 1 + 0.075 * Math.pow(Math.sin(time * 1.4), 8) + 0.02 * Math.sin(time * 2.8);
        const scale = (Math.min(width, height) / 34) * beat;

        // Tiêu cự camera 3D
        const fov = 420;

        // Ma trận xoay góc
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

        // Ánh hào quang rực rỡ phía sau tim
        const glow = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 210 * beat);
        glow.addColorStop(0, 'rgba(255, 42, 109, 0.42)');
        glow.addColorStop(0.4, 'rgba(201, 24, 74, 0.18)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 220 * beat, 0, Math.PI * 2);
        ctx.fill();

        const renderQueue = [];

        // 1. Tính tọa độ 3D các hạt tim
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (frame > p.delay && p.progress < 1) {
            p.progress += p.speed;
            if (p.progress > 1) p.progress = 1;
          }

          const ease = 1 - Math.pow(1 - p.progress, 3);

          // Biến đổi xoay 3D
          let x0 = p.origX * scale;
          let y0 = p.origY * scale;
          let z0 = p.origZ * scale;

          // Xoay Y
          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;

          // Xoay X
          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const targetProjX = centerX + (x1 * fov) / (fov + z2);
          const targetProjY = centerY + (y2 * fov) / (fov + z2);

          const drawX = p.currX + (targetProjX - p.currX) * ease;
          const drawY = p.currY + (targetProjY - p.currY) * ease;

          const depthRatio = (z2 + 180) / 360;
          const twinkle = 0.8 + 0.2 * Math.sin(time * 3 + p.twinkleOffset);

          renderQueue.push({
            type: 'particle',
            x: drawX,
            y: drawY,
            z: z2,
            size: p.size * (0.6 + 0.5 * depthRatio) * (0.3 + 0.7 * ease),
            color: p.color,
            alpha: Math.max(0.2, Math.min(1, (0.4 + 0.6 * depthRatio) * ease * twinkle))
          });
        }

        // 2. Trái tim nhỏ phụ bên cạnh
        for (let i = 0; i < miniHeartParticles.length; i++) {
          const mp = miniHeartParticles[i];
          const floatY = Math.sin(time * 1.5 + mp.phase) * 3;
          let x0 = mp.x * (scale * 0.7);
          let y0 = (mp.y + floatY) * (scale * 0.7);
          let z0 = mp.z * (scale * 0.7);

          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;
          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const projX = centerX + (x1 * fov) / (fov + z2);
          const projY = centerY + (y2 * fov) / (fov + z2);

          renderQueue.push({
            type: 'mini_particle',
            x: projX,
            y: projY,
            z: z2,
            size: mp.size,
            color: mp.color,
            alpha: 0.75 + 0.25 * Math.sin(time * 2 + mp.phase)
          });
        }

        // 3. Vành đai chữ 3D xoay lồng qua tim
        const textCount = ringTexts.length;
        const ringRadiusX = Math.min(width * 0.44, 210);
        const ringRadiusZ = ringRadiusX * 0.95;
        const ringYPos = centerY + 38 * (scale / 16);

        for (let i = 0; i < textCount; i++) {
          const angle = time * 0.35 + (i * 2 * Math.PI) / textCount;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          let x0 = cosA * ringRadiusX;
          let y0 = (sinA * 0.15) * ringRadiusX;
          let z0 = sinA * ringRadiusZ;

          // Áp dụng góc xoay cùng với toàn cảnh
          let x1 = x0 * cosY + z0 * sinY;
          let z1 = -x0 * sinY + z0 * cosY;
          let y2 = y0 * cosX - z1 * sinX;
          let z2 = y0 * sinX + z1 * cosX;

          const pX = centerX + (x1 * fov) / (fov + z2);
          const pY = ringYPos + (y2 * fov) / (fov + z2);

          const depthRatio = Math.max(0.1, Math.min(1, (z2 + ringRadiusZ) / (2 * ringRadiusZ)));

          renderQueue.push({
            type: 'text',
            text: ringTexts[i],
            x: pX,
            y: pY,
            z: z2,
            depthRatio: depthRatio
          });
        }

        // 4. Sắp xếp thứ tự Z (từ xa đến gần) để tạo chiều sâu chân thực
        renderQueue.sort((a, b) => a.z - b.z);

        // 5. Vẽ toàn bộ theo đúng chiều sâu
        for (let i = 0; i < renderQueue.length; i++) {
          const item = renderQueue[i];

          if (item.type === 'particle' || item.type === 'mini_particle') {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
            ctx.fillStyle = item.color;
            ctx.globalAlpha = item.alpha;
            ctx.shadowBlur = item.color === '#ffffff' ? 8 : 4;
            ctx.shadowColor = '#ff2a6d';
            ctx.fill();
          } else if (item.type === 'text') {
            const fontSize = 11.5 + item.depthRatio * 7.5;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.globalAlpha = 0.25 + 0.75 * item.depthRatio;
            ctx.fillStyle = item.depthRatio > 0.65 ? '#ffffff' : '#ffccd5';
            ctx.shadowBlur = item.depthRatio > 0.65 ? 14 : 5;
            ctx.shadowColor = '#ff2a6d';
            ctx.fillText(item.text, item.x, item.y);
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
